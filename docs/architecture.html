<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>System Anatomy — Fantasy Life 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0d0f14; --surface:#13161d; --surface2:#1a1e28; --border:#232733;
    --text:#e8eaf0; --muted:#7b8494; --blue:#2d7dd2; --gold:#f59e0b;
    --green:#22c55e; --red:#ef4444; --purple:#a855f7; --cyan:#22d3ee;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}

  /* ── Top bar ── */
  .topbar{position:fixed;top:0;left:0;right:0;height:58px;z-index:40;
    background:rgba(15,18,24,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;padding:0 16px}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.5px;line-height:1}
  .brand span{color:var(--gold)}
  .tag{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);border:1px solid var(--border);
    padding:3px 7px;border-radius:5px}
  .spacer{flex:1}
  .ctrl{display:flex;align-items:center;gap:6px}
  button.btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);
    border-radius:7px;padding:7px 11px;font-family:'DM Sans';font-size:13px;cursor:pointer;transition:.12s}
  button.btn:hover{border-color:var(--blue);color:#fff}
  button.btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .zoombtn{width:32px;height:32px;font-size:17px;display:flex;align-items:center;justify-content:center;padding:0}

  /* ── Flow rail ── */
  .flowrail{position:fixed;top:58px;left:0;right:0;z-index:35;background:rgba(19,22,29,.9);
    border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .flowrail .lbl{font-family:'DM Mono';font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-right:4px}
  .flowchip{font-size:12.5px;padding:5px 10px;border-radius:14px;border:1px solid var(--border);
    background:transparent;color:var(--text);cursor:pointer;transition:.12s;font-family:'DM Sans'}
  .flowchip:hover{border-color:var(--cyan)}
  .flowchip.active{background:var(--cyan);color:#04222b;border-color:var(--cyan);font-weight:600}
  .stepper{display:none;align-items:center;gap:8px;margin-left:auto}
  .stepper.show{display:flex}
  .stepper .stepinfo{font-family:'DM Mono';font-size:11.5px;color:var(--muted)}

  /* ── Canvas ── */
  #scroller{position:absolute;top:104px;left:0;right:0;bottom:0;overflow:auto}
  #viewport{transform-origin:0 0;transition:transform .15s ease}
  #canvas{position:relative}
  svg.edges{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
  svg.edges path{pointer-events:stroke;cursor:pointer}

  .band{position:absolute;left:0;border-radius:10px;border:1px solid rgba(255,255,255,.03)}
  .band .bandlabel{position:absolute;left:12px;top:8px;font-family:'Bebas Neue';font-size:17px;
    letter-spacing:1.5px;opacity:.5}
  .band .bandsub{position:absolute;left:12px;top:30px;font-family:'DM Mono';font-size:10px;
    color:var(--muted);opacity:.7}

  .node{position:absolute;width:158px;min-height:62px;background:var(--surface);border:1.5px solid var(--border);
    border-radius:10px;padding:8px 10px;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;
    z-index:5;display:flex;flex-direction:column;gap:3px}
  .node:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .node .ntop{display:flex;align-items:center;gap:6px}
  .node .nicon{font-size:15px;line-height:1}
  .node .nlabel{font-size:12.5px;font-weight:600;line-height:1.1}
  .node .nsub{font-family:'DM Mono';font-size:9.5px;color:var(--muted);line-height:1.2}
  .node .nchips{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
  .node .nchip{font-size:8.5px;font-family:'DM Mono';color:var(--muted);background:var(--surface2);
    border-radius:4px;padding:1px 4px;white-space:nowrap}
  .node.legacy{opacity:.5;border-style:dashed}
  .node.dim{opacity:.22}
  .node.adj{border-color:var(--gold)}
  .node.sel{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(34,211,238,.35),0 8px 22px rgba(0,0,0,.5)}
  .node.flowhi{border-color:var(--cyan)}
  .node.flowfocus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.5),0 8px 26px rgba(0,0,0,.6);transform:scale(1.05)}

  /* node accent by layer */
  .node[data-c="ext"]{border-left:4px solid var(--purple)}
  .node[data-c="ingest"]{border-left:4px solid var(--cyan)}
  .node[data-c="store"]{border-left:4px solid var(--blue)}
  .node[data-c="proc"]{border-left:4px solid var(--gold)}
  .node[data-c="out"]{border-left:4px solid var(--green)}
  .node[data-c="present"]{border-left:4px solid #e879f9}
  .node[data-c="client"]{border-left:4px solid #fb923c}
  .node[data-c="orch"]{border-left:4px solid var(--red)}

  /* ── Detail drawer ── */
  #drawer{position:fixed;top:0;right:0;height:100%;width:420px;max-width:92vw;z-index:60;
    background:var(--surface);border-left:1px solid var(--border);transform:translateX(100%);
    transition:transform .22s ease;overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.5)}
  #drawer.open{transform:translateX(0)}
  .dhead{padding:18px 18px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;
    background:var(--surface);z-index:2}
  .dhead .dkind{font-family:'DM Mono';font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cyan)}
  .dhead .dtitle{font-family:'Bebas Neue';font-size:30px;letter-spacing:.5px;margin-top:3px;line-height:1}
  .dhead .dfiles{font-family:'DM Mono';font-size:11px;color:var(--gold);margin-top:7px;word-break:break-all}
  .dclose{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:7px;border:1px solid var(--border);
    background:var(--surface2);color:var(--text);cursor:pointer;font-size:16px}
  .dbody{padding:16px 18px 60px}
  .drole{font-size:13.5px;line-height:1.55;color:#cdd3df;margin-bottom:16px}
  .dsec{margin-bottom:16px}
  .dsec h4{font-family:'DM Mono';font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .dsec h4::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .dsec.io h4{color:var(--blue)} .dsec.fail h4{color:var(--red)} .dsec.concept h4{color:var(--gold)}
  .dlist{list-style:none;display:flex;flex-direction:column;gap:6px}
  .dlist li{font-size:12.5px;line-height:1.45;color:#cdd3df;padding-left:14px;position:relative}
  .dlist li::before{content:"▸";position:absolute;left:0;color:var(--muted);font-size:10px;top:2px}
  .dsec.concept .dlist li::before{content:"◆";color:var(--gold)}
  .dsec.fail .dlist li::before{content:"!";color:var(--red);font-weight:700;left:2px}
  .kv{display:flex;gap:8px;font-size:12.5px;margin-bottom:5px}
  .kv .k{font-family:'DM Mono';font-size:10.5px;color:var(--muted);min-width:64px;padding-top:2px;text-transform:uppercase;letter-spacing:.5px}
  .kv .v{color:#cdd3df;line-height:1.45;flex:1}
  code{font-family:'DM Mono';font-size:11.5px;background:var(--surface2);padding:1px 5px;border-radius:4px;color:var(--cyan)}

  /* ── Legend / help ── */
  #legend{position:fixed;left:14px;bottom:14px;z-index:30;background:rgba(19,22,29,.92);
    border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:11px;max-width:230px}
  #legend h5{font-family:'DM Mono';font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
  .legrow{display:flex;align-items:center;gap:7px;margin-bottom:4px;color:#cdd3df}
  .legswatch{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  #legend .hint{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);color:var(--muted);line-height:1.45}
  .legtoggle{position:fixed;left:14px;bottom:14px;z-index:31;display:none}

  @media (max-width:720px){
    #legend{display:none}
    .brand{font-size:21px}.tag{display:none}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">FANTASY <span>LIFE</span> · ANATOMY</div>
  <div class="tag">interactive system map</div>
  <div class="spacer"></div>
  <div class="ctrl">
    <button class="btn zoombtn" id="zoomout">−</button>
    <button class="btn zoombtn" id="zoomin">+</button>
    <button class="btn" id="reset">Reset</button>
  </div>
</div>

<div class="flowrail">
  <span class="lbl">Follow the data</span>
  <button class="flowchip" data-flow="daily">① Daily pipeline</button>
  <button class="flowchip" data-flow="bet">② Place a bet</button>
  <button class="flowchip" data-flow="headline">③ Headline gen</button>
  <button class="flowchip" data-flow="settle">④ Settle an event</button>
  <div class="stepper" id="stepper">
    <button class="btn" id="prevstep">◀</button>
    <span class="stepinfo" id="stepinfo">1 / 1</span>
    <button class="btn" id="nextstep">▶</button>
    <button class="btn" id="exitflow">✕ exit</button>
  </div>
</div>

<div id="scroller">
  <div id="viewport">
    <div id="canvas">
      <svg class="edges" id="edgesvg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#3a4150"/>
          </marker>
          <marker id="arrowhi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
          </marker>
        </defs>
      </svg>
    </div>
  </div>
</div>

<div id="legend">
  <h5>Layers</h5>
  <div class="legrow"><span class="legswatch" style="background:#ef4444"></span>Orchestration (the clock)</div>
  <div class="legrow"><span class="legswatch" style="background:#a855f7"></span>External sources</div>
  <div class="legrow"><span class="legswatch" style="background:#22d3ee"></span>Ingestion</div>
  <div class="legrow"><span class="legswatch" style="background:#2d7dd2"></span>Storage</div>
  <div class="legrow"><span class="legswatch" style="background:#f59e0b"></span>Processing</div>
  <div class="legrow"><span class="legswatch" style="background:#22c55e"></span>Outputs</div>
  <div class="legrow"><span class="legswatch" style="background:#e879f9"></span>Presentation</div>
  <div class="legrow"><span class="legswatch" style="background:#fb923c"></span>Client state</div>
  <div class="hint">Click any <b>node</b> or <b>arrow</b> for detail + interview talking points. Dashed = legacy / not in prod.</div>
</div>

<div id="drawer">
  <div class="dhead">
    <button class="dclose" id="dclose">✕</button>
    <div class="dkind" id="dkind"></div>
    <div class="dtitle" id="dtitle"></div>
    <div class="dfiles" id="dfiles"></div>
  </div>
  <div class="dbody" id="dbody"></div>
</div>

<script>
/* ============================================================
   DATA MODEL  —  nodes, edges, flows
   ============================================================ */
const LAYERS = [
  {id:"orch",    label:"ORCHESTRATION",  sub:"GitHub Actions cron · the heartbeat",            y:0,    h:108, color:"rgba(239,68,68,.05)"},
  {id:"ext",     label:"EXTERNAL SOURCES",sub:"public APIs & sites · the environment",         y:120,  h:118, color:"rgba(168,85,247,.05)"},
  {id:"ingest",  label:"INGESTION",      sub:"scrapers + hand-curated overrides",              y:258,  h:104, color:"rgba(34,211,238,.05)"},
  {id:"store",   label:"STORAGE",        sub:"Supabase (Postgres/REST) + in-code static dicts",y:382,  h:128, color:"rgba(45,125,210,.05)"},
  {id:"proc",    label:"PROCESSING",     sub:"Python compute · runs in the daily job",         y:530,  h:128, color:"rgba(245,158,11,.05)"},
  {id:"out",     label:"OUTPUTS",        sub:"committed JSON · static 'API' served by Pages",  y:678,  h:104, color:"rgba(34,197,94,.05)"},
  {id:"present", label:"PRESENTATION",   sub:"static HTML (docs/) on GitHub Pages",            y:802,  h:118, color:"rgba(232,121,249,.05)"},
  {id:"client",  label:"CLIENT STATE",   sub:"browser ↔ Supabase, no backend",                y:940,  h:104, color:"rgba(251,146,60,.05)"},
];
const CANVAS_W = 1560, CANVAS_H = 1064, PADX = 28, NODEW = 158;

function L(id){return LAYERS.find(l=>l.id===id);}
function nodeY(layerId){return L(layerId).y + 44;}

const NODES = [
  /* ---------- ORCHESTRATION ---------- */
  {id:"daily", c:"orch", icon:"⏰", label:"daily.yml", sub:"cron 0 8 * * *", xn:0.30,
   chips:["cron","pipeline"],
   detail:{kind:"GitHub Actions workflow",files:".github/workflows/daily.yml",
    role:"The heartbeat. Every day at 08:00 UTC it runs the whole pipeline in one job, then commits the two output JSONs to <code>main</code> — and the commit itself is the deploy.",
    io:[["trigger","cron <code>0 8 * * *</code> + manual workflow_dispatch"],
        ["steps","checkout → pip install → scrapers.py → scoring.py → projections.py → headline.py → sanity-check → commit+push"],
        ["commit","<code>chore: update scores + projections …</code> with <code>git pull --rebase origin main</code> before push"]],
    fail:["projections & headline run <code>continue-on-error: true</code> — an API outage is swallowed, the job still 'succeeds' with stale data",
          "Race on main: 4–5 bot commits/day; a feature branch open >a few hours collides with the rebase-push window"],
    concept:["Cron orchestration of a sequential batch pipeline","'Commit-as-deploy' — git history is the deploy log & audit trail","Partial-failure tolerance via continue-on-error (availability over consistency)","Shared-mutable-state concurrency: the push race on main"]}},

  {id:"headlineyml", c:"orch", icon:"📰", label:"headline.yml", sub:"manual · --force", xn:0.50,
   chips:["manual"],legacyish:true,
   detail:{kind:"GitHub Actions workflow",files:".github/workflows/headline.yml",
    role:"Manual-dispatch-only re-run of the headline step, always passing <code>--force</code> to bypass the dedup guard. Scheduled headline generation now lives inside daily.yml; this exists for one-off refreshes.",
    io:[["trigger","workflow_dispatch only (no cron)"],
        ["push","<code>git pull --rebase -X ours origin main</code> — keeps its own version on conflict"]],
    fail:["<code>-X ours</code> can clobber a concurrent scores.json update if timing is unlucky"],
    concept:["Idempotency override (--force) vs the guard","Conflict strategy as policy (-X ours = 'I win')"]}},

  {id:"ghpages", c:"orch", icon:"🌐", label:"GitHub Pages", sub:"serves docs/", xn:0.70,
   chips:["CDN","static"],
   detail:{kind:"Static hosting",files:"docs/ (.nojekyll, CNAME)",
    role:"Serves everything in <code>docs/</code> as a static site on every push to main. No server, no build step — the JSON files are read directly by the browser.",
    io:[["serves","all docs/*.html, scores.json, projections.json, images"],
        ["deploy","auto-rebuild on push to main"]],
    fail:["No atomic deploy: a half-committed JSON would serve broken data until the next commit","Cache/CDN lag after a push"],
    concept:["JAMstack / static-first architecture","The 'database' is a committed JSON file behind a CDN","Read-scaling for free; write path is the only complex part"]}},

  {id:"skills", c:"orch", icon:"🛠️", label:"Claude Skills", sub:"fl-merge · fl-bonus · …", xn:0.88,
   chips:["ops","runbook"],
   detail:{kind:"Operational runbooks (.claude/commands)",files:".claude/commands/*.md",
    role:"Eight codified runbooks that hide operational complexity: fl-merge (squash-ship), fl-bonus (award points), fl-settle (event-resolution checklist), fl-bet, fl-headline, fl-repair, fl-category-fix, learning.",
    io:[["fl-settle","the multi-file dance: bonuses.json + sportsbook.html BETS + projections.py _PROP_DEFS + data/sb_settled.json, then merge"],
        ["fl-merge","conflict rules: scores/projections.json → take origin/main; code/html → take HEAD; bonuses.json → manual merge"]],
    fail:["Skills encode the DRY violations rather than fixing them (e.g. prop ids must match across 2 files by hand)"],
    concept:["Runbooks-as-code: encoding tribal ops knowledge","Reduces change-failure rate for multi-step, multi-file edits","A smell detector — a skill exists because the design forces coordinated edits"]}},

  /* ---------- EXTERNAL SOURCES ---------- */
  {id:"espn", c:"ext", icon:"🏟️", label:"ESPN API", sub:"NBA·NCAAB·Tennis·fallbacks", xn:0.02,
   chips:["public","403-prone"],
   detail:{kind:"External REST API",files:"scrapers.py:49 _espn_standings()",
    role:"Public ESPN endpoints, hit as primary for NCAAB and as a fallback for NHL/MLB/Golf/Tennis. Tries 3 URL variants per call.",
    io:[["data","standings / top-25 polls / rankings JSON"],["auth","none (browser-like headers)"]],
    fail:["403/IP-blocks (this is what kills MLS & NASCAR)","Returns [] on failure → empty data can be silently saved"],
    concept:["Adapter per source with a fallback ladder","Scraping public APIs = brittle, unversioned contract"]}},
  {id:"nhlapi", c:"ext", icon:"🏒", label:"NHL API", sub:"api-web.nhle.com", xn:0.12,chips:["official"],
   detail:{kind:"External REST API",files:"scrapers.py:93 _nhl_official_standings()",
    role:"Official NHL stats API — primary source for NHL, with ESPN as fallback. Computes <code>points_pct = pts/(gp*2)</code>.",
    io:[["data","<code>{team, points_pct}</code> list"]],fail:["raise_for_status → caught, falls back to ESPN"],
    concept:["Prefer the official contract; keep a scraped fallback"]}},
  {id:"mlbapi", c:"ext", icon:"⚾", label:"MLB Stats API", sub:"statsapi.mlb.com", xn:0.22,chips:["official"],
   detail:{kind:"External REST API",files:"scrapers.py:140 _mlb_statsapi_standings()",
    role:"Official MLB stats API. Checks total games-played to detect pre-season and avoid saving junk early data.",
    io:[["data","<code>{team, win_pct, gp}</code>"]],fail:["pre-season guard prevents writing 0-0 noise"],
    concept:["Input validation at ingest (reject implausible data)"]}},
  {id:"owgr", c:"ext", icon:"⛳", label:"OWGR", sub:"owgr.com + cloudscraper", xn:0.32,chips:["bot-blocked"],
   detail:{kind:"External API + HTML",files:"scrapers.py:349 scrape_golf()",
    role:"Golf world rankings. Three-tier ladder: plain JSON request → cloudscraper (bot-detection bypass) → ESPN.",
    io:[["data","<code>{player, rank}</code>"]],fail:["Often blocked → scoring falls back to GOLF_2026_OWGR_STATIC frozen dict"],
    concept:["Anti-bot arms race; static snapshot as last resort"]}},
  {id:"yahoo", c:"ext", icon:"📈", label:"Yahoo Finance", sub:"query1.finance…", xn:0.42,chips:["per-ticker"],
   detail:{kind:"External API",files:"scrapers.py:412 scrape_stock()",
    role:"YTD stock chart per ticker (one request each). Computes % change from Jan-1 baseline; shorts are negated downstream.",
    io:[["data","<code>{ticker, current_price, jan1_price, ytd_pct_raw}</code>"]],fail:["bad ticker → skipped, others continue (partial success)"],
    concept:["Fan-out of N independent calls; partial-failure isolation"]}},
  {id:"imf", c:"ext", icon:"🌍", label:"IMF DataMapper", sub:"GDP growth", xn:0.52,chips:["hand-preferred"],
   detail:{kind:"External API",files:"scrapers.py:444 scrape_country_gdp()",
    role:"GDP-growth forecasts by ISO code. In practice scoring prefers the hand-edited <code>data/country.json</code>; the scraper is the fallback.",
    io:[["data","<code>{country, gdp_growth_pct}</code>"]],
    concept:["Human-curated source-of-truth over a flaky API"]}},
  {id:"wikipedia", c:"ext", icon:"🎵", label:"Wikipedia", sub:"Billboard charts", xn:0.62,chips:["HTML-scrape"],
   detail:{kind:"HTML scrape",files:"scrapers.py:492 scrape_billboard()",
    role:"Parses two Wikipedia chart pages with BeautifulSoup to count #1 weeks and Hot-100 weeks per artist. Musician score = 2×num1 + hot100.",
    io:[["data","<code>{artist, num1_weeks, hot100_weeks}</code>"]],fail:["Fragile to page-format changes; silent empty on selector miss"],
    concept:["HTML scraping = parsing an unversioned UI as an API"]}},
  {id:"kalshi", c:"ext", icon:"📊", label:"Kalshi", sub:"prediction markets", xn:0.745,chips:["RSA-PSS","odds"],
   detail:{kind:"Signed REST API",files:"projections.py:188 _kalshi_sign() · :505 KNOWN_SERIES",
    role:"Live prediction-market prices used as the top tier of the odds chain. Requests are RSA-PSS signed (timestamp+method+path).",
    io:[["auth","RSA-PSS sig → Bearer token → unauthenticated (3-tier)"],["data","yes_bid/ask dollars per market title"]],
    fail:["Event-level tickers 404 on the new host","Settled markets return null prices → must be filtered","Bad PEM → signer throws, silently degrades to static FALLBACK"],
    concept:["Cryptographic request signing (replay-resistant auth)","Graceful auth degradation","External price feed as an optional enrichment"]}},
  {id:"tavily", c:"ext", icon:"🔎", label:"Tavily", sub:"news search", xn:0.86,chips:["news"],
   detail:{kind:"External API",files:"headline.py:38 search_news()",
    role:"News-search API. Fires ~8–10 targeted queries (one per active event class) so no category gets starved, last-3-days window.",
    io:[["data","title + 300-char snippet per result, deduped by title"]],fail:["No key / no results → headline generation aborts (no hallucination)"],
    concept:["Query fan-out to guarantee coverage","Grounding an LLM with retrieved facts (RAG-lite)"]}},
  {id:"anthropic", c:"ext", icon:"🤖", label:"Anthropic", sub:"Claude (headline)", xn:0.96,chips:["LLM"],
   detail:{kind:"LLM API",files:"headline.py:98 generate_headline() · model claude-sonnet-4-6",
    role:"Writes the ~50-word FL-News ticker from the Tavily snippets only. Prompt forbids using training knowledge (no stale casting claims, no invented scores).",

const pos = {}; // id -> {x,y,w,h}
function place(){
  const usable = CANVAS_W - 2*PADX - NODEW;
  NODES.forEach(n=>{
    const x = PADX + n.xn*usable;
    const y = nodeY(n.c);
    pos[n.id] = {x,y,w:NODEW,h:64,cx:x+NODEW/2};
  });
}

// edge paths
const SVGNS="http://www.w3.org/2000/svg";
const edgeEls=[];
function edgePath(a,b){
  const s=pos[a], t=pos[b];
  if(!s||!t) return "";
  const sx=s.cx, tx=t.cx;
  if(t.y > s.y+5){ // downward
    const sy=s.y+s.h, ty=t.y;
    const my=(sy+ty)/2;
    return `M${sx},${sy} C${sx},${my} ${tx},${my} ${tx},${ty}`;
  } else if(s.y > t.y+5){ // upward (feedback)
    const sy=s.y, ty=t.y+t.h;
    const my=(sy+ty)/2;
    return `M${sx},${sy} C${sx},${my} ${tx},${my} ${tx},${ty}`;
  } else { // same layer — bow out the side
    const sy=s.y+s.h/2, ty=t.y+t.h/2;
    const dir = tx>sx?1:-1;
    const bow=Math.max(40,Math.abs(tx-sx)/2);
    const sX = sx + dir*(s.w/2), tX = tx - dir*(t.w/2);
    return `M${sX},${sy} C${sX+dir*bow},${sy-bow} ${tX-dir*bow},${ty-bow} ${tX},${ty}`;
  }
}
EDGES.forEach((e,i)=>{
  const [from,to,label,fmt,trig,invoke,legacy]=e;
  const p=document.createElementNS(SVGNS,'path');
  p.setAttribute('d',edgePath(from,to));
  p.setAttribute('fill','none');
  p.setAttribute('stroke', invoke?'#7f1d1d':'#2b3140');
  p.setAttribute('stroke-width', invoke?1.4:1.6);
  if(invoke) p.setAttribute('stroke-dasharray','5 4');
  if(legacy){p.setAttribute('stroke-dasharray','2 4');p.setAttribute('opacity','.4');}
  p.setAttribute('marker-end','url(#arrow)');
  p.dataset.from=from; p.dataset.to=to; p.dataset.i=i;
  p.classList.add('edge');
  p.addEventListener('click',ev=>{ev.stopPropagation();openEdge(i);});
  svg.appendChild(p);
  edgeEls.push(p);
});

// nodes
const nodeEls={};
NODES.forEach(n=>{
  const d=document.createElement('div');
  d.className='node'+(n.legacy?' legacy':'');
  d.dataset.id=n.id; d.dataset.c=n.c;
  d.style.left=pos[n.id].x+'px'; d.style.top=pos[n.id].y+'px';
  const chips=(n.chips||[]).slice(0,3).map(c=>`<span class="nchip">${c}</span>`).join('');
  d.innerHTML=`<div class="ntop"><span class="nicon">${n.icon}</span><span class="nlabel">${n.label}</span></div>
    <div class="nsub">${n.sub}</div><div class="nchips">${chips}</div>`;
  d.addEventListener('click',ev=>{ev.stopPropagation();selectNode(n.id);});
  canvas.appendChild(d);
  nodeEls[n.id]=d;
});

/* ============================================================
   INTERACTION
   ============================================================ */
const drawer=document.getElementById('drawer');
function clearHi(){
  Object.values(nodeEls).forEach(el=>el.classList.remove('dim','adj','sel','flowhi','flowfocus'));
  edgeEls.forEach(p=>{p.classList.remove('hl');p.setAttribute('marker-end','url(#arrow)');
    p.setAttribute('stroke', p.dataset.invoke==='1'?'#7f1d1d':'#2b3140');p.style.opacity='';});
}
function selectNode(id){
  exitFlowMode(true);
  clearHi();
  const adj=new Set();
  edgeEls.forEach(p=>{
    if(p.dataset.from===id||p.dataset.to===id){
      p.classList.add('hl'); p.setAttribute('stroke','#22d3ee');p.setAttribute('marker-end','url(#arrowhi)');
      adj.add(p.dataset.from); adj.add(p.dataset.to);
    }
  });
  Object.values(nodeEls).forEach(el=>{
    if(el.dataset.id===id) el.classList.add('sel');
    else if(adj.has(el.dataset.id)) el.classList.add('adj');
    else el.classList.add('dim');
  });
  openNode(id);
}
function openNode(id){
  const n=NODES.find(x=>x.id===id); const dt=n.detail;
  document.getElementById('dkind').textContent=dt.kind;
  document.getElementById('dtitle').textContent=n.label;
  document.getElementById('dfiles').innerHTML=dt.files||'';
  let h=`<div class="drole">${dt.role}</div>`;
  if(dt.io&&dt.io.length){h+=`<div class="dsec io"><h4>Inputs · Outputs</h4>`;
    dt.io.forEach(([k,v])=>h+=`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`);h+=`</div>`;}
  if(dt.fail&&dt.fail.length){h+=`<div class="dsec fail"><h4>Failure modes</h4><ul class="dlist">`+
    dt.fail.map(f=>`<li>${f}</li>`).join('')+`</ul></div>`;}
  if(dt.concept&&dt.concept.length){h+=`<div class="dsec concept"><h4>Systems-design talking points</h4><ul class="dlist">`+
    dt.concept.map(c=>`<li>${c}</li>`).join('')+`</ul></div>`;}
  document.getElementById('dbody').innerHTML=h;
  drawer.classList.add('open');
}
function openEdge(i){
  const [from,to,label,fmt,trig]=EDGES[i];
  clearHi();
  const p=edgeEls[i]; p.classList.add('hl');p.setAttribute('stroke','#22d3ee');p.setAttribute('marker-end','url(#arrowhi)');
  nodeEls[from].classList.add('adj'); nodeEls[to].classList.add('sel');
  Object.values(nodeEls).forEach(el=>{if(el.dataset.id!==from&&el.dataset.id!==to)el.classList.add('dim');});
  const fn=NODES.find(x=>x.id===from), tn=NODES.find(x=>x.id===to);
  document.getElementById('dkind').textContent='Data flow';
  document.getElementById('dtitle').textContent=label;
  document.getElementById('dfiles').innerHTML=`${fn.icon} ${fn.label} &nbsp;→&nbsp; ${tn.icon} ${tn.label}`;
  document.getElementById('dbody').innerHTML=
    `<div class="dsec io"><h4>Edge detail</h4>
      <div class="kv"><span class="k">from</span><span class="v">${fn.label} — ${fn.detail.kind}</span></div>
      <div class="kv"><span class="k">to</span><span class="v">${tn.label} — ${tn.detail.kind}</span></div>
      <div class="kv"><span class="k">payload</span><span class="v">${label}</span></div>
      <div class="kv"><span class="k">format</span><span class="v">${fmt}</span></div>
      <div class="kv"><span class="k">trigger</span><span class="v">${trig}</span></div>
    </div>
    <div class="dsec concept"><h4>Why it matters</h4><ul class="dlist">
      <li>Trace this edge in <b>Follow the data</b> to see where it sits in an end-to-end flow.</li>
    </ul></div>`;
  drawer.classList.add('open');
}
document.getElementById('dclose').addEventListener('click',()=>drawer.classList.remove('open'));
document.getElementById('scroller').addEventListener('click',()=>{drawer.classList.remove('open');if(!flowMode)clearHi();});

/* ── Flow mode ── */
let flowMode=null, flowStep=0;
function startFlow(id){
  flowMode=id; flowStep=0;
  document.querySelectorAll('.flowchip').forEach(c=>c.classList.toggle('active',c.dataset.flow===id));
  document.getElementById('stepper').classList.add('show');
  renderFlow();
}
function renderFlow(){
  clearHi();
  const f=FLOWS[flowMode]; const set=new Set(f.steps);
  // highlight edges connecting consecutive steps
  const wanted=new Set();
  for(let i=0;i<f.steps.length-1;i++) wanted.add(f.steps[i]+'>'+f.steps[i+1]);
  edgeEls.forEach(p=>{
    const key=p.dataset.from+'>'+p.dataset.to;
    if(wanted.has(key)){p.classList.add('hl');p.setAttribute('stroke','#22d3ee');p.setAttribute('marker-end','url(#arrowhi)');}
    else p.style.opacity='.12';
  });
  Object.values(nodeEls).forEach(el=>{
    if(set.has(el.dataset.id)) el.classList.add('flowhi'); else el.classList.add('dim');
  });
  f.steps.forEach((sid,i)=>{ if(i===flowStep) nodeEls[sid].classList.add('flowfocus'); });
  document.getElementById('stepinfo').textContent=(flowStep+1)+' / '+f.steps.length;
  // focus node detail + scroll into view
  const cur=f.steps[flowStep];
  openNode(cur);
  const el=nodeEls[cur];
  el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
}
function exitFlowMode(silent){
  if(!flowMode) return;
  flowMode=null;
  document.querySelectorAll('.flowchip').forEach(c=>c.classList.remove('active'));
  document.getElementById('stepper').classList.remove('show');
  if(!silent){clearHi();drawer.classList.remove('open');}
}
document.querySelectorAll('.flowchip').forEach(c=>{
  c.addEventListener('click',()=>{ if(flowMode===c.dataset.flow) exitFlowMode(); else startFlow(c.dataset.flow); });
});
document.getElementById('nextstep').addEventListener('click',()=>{const f=FLOWS[flowMode];flowStep=(flowStep+1)%f.steps.length;renderFlow();});
document.getElementById('prevstep').addEventListener('click',()=>{const f=FLOWS[flowMode];flowStep=(flowStep-1+f.steps.length)%f.steps.length;renderFlow();});
document.getElementById('exitflow').addEventListener('click',()=>exitFlowMode());

document.getElementById('reset').addEventListener('click',()=>{exitFlowMode();clearHi();drawer.classList.remove('open');setZoom(1);});

/* ── Zoom ── */
let zoom=1; const vp=document.getElementById('viewport');
function setZoom(z){zoom=Math.min(1.6,Math.max(0.4,z));vp.style.transform='scale('+zoom+')';
  canvas.style.transformOrigin='0 0';}
document.getElementById('zoomin').addEventListener('click',()=>setZoom(zoom+0.15));
document.getElementById('zoomout').addEventListener('click',()=>setZoom(zoom-0.15));
// fit-to-width on load (mobile)
function fit(){
  const sw=document.getElementById('scroller').clientWidth;
  if(sw < CANVAS_W) setZoom(Math.max(0.4, sw/CANVAS_W));
}
window.addEventListener('resize',fit); fit();

// mark invoke edges for restore
EDGES.forEach((e,i)=>{ if(e[5]) edgeEls[i].dataset.invoke='1'; });
</script>
</body>
</html>
