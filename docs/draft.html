<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FL Draft 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d26;
      --surface2: #222638;
      --border:   rgba(255,255,255,0.08);
      --text:     #e2e8f0;
      --muted:    #64748b;
      --green:    #22c55e;
      --red:      #ef4444;
      --yellow:   #f59e0b;
      --purple:   #a855f7;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
    }

    a { color: inherit; }

    /* ── LOADING ─────────────────────────────────────────────── */
    .loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; color: var(--muted); font-size: 0.9rem;
    }

    .error-msg {
      max-width: 500px; margin: 4rem auto; padding: 1.5rem;
      background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px; font-size: 0.8rem; color: var(--red); line-height: 1.6;
    }

    /* ── LOGIN ───────────────────────────────────────────────── */
    .login-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; padding: 2rem; gap: 1.5rem;
    }
    .login-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 3rem;
      letter-spacing: 0.12em; color: var(--purple);
    }
    .login-sub {
      font-size: 0.72rem; color: var(--muted);
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .player-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 0.75rem; width: 100%; max-width: 560px;
    }
    .player-btn {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: 'DM Mono', monospace;
      font-size: 0.88rem; font-weight: 500; padding: 0.7rem 0.5rem;
      cursor: pointer; transition: all 0.15s; letter-spacing: 0.04em;
    }
    .player-btn:hover {
      border-color: var(--purple); background: rgba(168,85,247,0.1); color: var(--purple);
    }

    /* ── SHARED CARDS ────────────────────────────────────────── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.1rem 1.25rem;
    }
    .card-label {
      font-size: 0.58rem; font-weight: 500; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem;
      display: block;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
    .dot-sm { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot.online, .dot-sm.online { background: var(--green); }
    .dot.offline, .dot-sm.offline { background: var(--muted); opacity: 0.35; }

    /* ── LOBBY ───────────────────────────────────────────────── */
    .lobby-wrap {
      max-width: 820px; margin: 0 auto;
      padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;
    }
    .lobby-header {
      display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    }
    .lobby-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem;
      letter-spacing: 0.12em; color: var(--purple);
    }
    .lobby-you { font-size: 0.72rem; color: var(--muted); margin-left: auto; }
    .change-link {
      font-size: 0.62rem; color: var(--muted); text-decoration: none; margin-left: 6px;
    }
    .change-link:hover { color: var(--text); }

    .lobby-cols {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;
    }
    @media (max-width: 580px) { .lobby-cols { grid-template-columns: 1fr; } }

    /* Order list */
    .order-list { display: flex; flex-direction: column; gap: 3px; }
    .order-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 6px 8px; border-radius: 6px;
      border: 1px solid transparent; transition: background 0.1s;
    }
    .order-item[draggable="true"] { cursor: grab; }
    .order-item[draggable="true"]:active { cursor: grabbing; }
    .order-item[draggable="true"]:hover { background: var(--surface2); }
    .order-item.drag-over  { border-color: var(--purple); background: rgba(168,85,247,0.08); }
    .order-item.dragging   { opacity: 0.35; }
    .order-num { font-size: 0.62rem; color: var(--muted); width: 18px; text-align: right; }
    .order-name { flex: 1; font-size: 0.82rem; }

    /* Presence */
    .presence-item {
      display: flex; align-items: center; gap: 0.55rem;
      font-size: 0.78rem; padding: 3px 0;
    }
    .presence-item.muted { color: var(--muted); }

    .lobby-hint { font-size: 0.66rem; color: var(--muted); font-style: italic; margin-top: 0.5rem; }
    .waiting-msg { text-align: center; color: var(--muted); font-size: 0.78rem; padding: 0.75rem; }

    .admin-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    /* ── BOARD ───────────────────────────────────────────────── */
    .board-wrap {
      display: flex; flex-direction: column;
      min-height: 100vh; padding: 0.9rem 1.1rem; gap: 0.9rem;
    }
    .board-header {
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    }
    .board-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem;
      letter-spacing: 0.12em; color: var(--purple);
    }
    .board-meta { display: flex; gap: 0.4rem; align-items: center; }

    .badge {
      font-size: 0.58rem; font-weight: 500; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 2px 7px; border-radius: 4px;
    }
    .badge-purple {
      background: rgba(168,85,247,0.15); color: var(--purple);
      border: 1px solid rgba(168,85,247,0.3);
    }
    .badge-muted {
      background: rgba(100,116,139,0.12); color: var(--muted);
      border: 1px solid var(--border);
    }
    .badge-yellow {
      font-size: 0.55rem; color: var(--yellow); border: 1px solid rgba(245,158,11,0.35);
      padding: 1px 6px; border-radius: 3px; background: rgba(245,158,11,0.07);
    }

    .board-you { margin-left: auto; font-size: 0.7rem; color: var(--muted); }

    .board-layout {
      display: flex; gap: 1.1rem; align-items: flex-start; flex: 1;
    }
    @media (max-width: 800px) {
      .board-layout { flex-direction: column; }
      .left-panel   { width: 100% !important; }
    }

    .left-panel {
      width: 232px; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 0.7rem;
    }

    /* Timer */
    .timer-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.9rem 1.1rem; text-align: center;
    }
    .timer-card.paused { border-color: rgba(245,158,11,0.3); }
    .timer-label { font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .timer-display {
      font-family: 'Bebas Neue', sans-serif; font-size: 3.4rem;
      line-height: 1; margin: 2px 0; transition: color 0.4s;
    }
    .timer-sub { font-size: 0.6rem; color: var(--muted); }

    /* Your turn */
    .your-turn-card {
      background: rgba(168,85,247,0.05); border: 1px solid rgba(168,85,247,0.28);
      border-radius: 12px; padding: 1rem 1.1rem;
      display: flex; flex-direction: column; gap: 0.6rem;
    }
    .your-turn-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.35rem;
      letter-spacing: 0.1em; color: var(--purple); line-height: 1;
    }
    .your-turn-sub { font-size: 0.62rem; color: var(--muted); margin-top: -4px; }

    /* Waiting */
    .waiting-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1rem 1.1rem; text-align: center;
    }
    .waiting-name {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.75rem;
      letter-spacing: 0.06em; line-height: 1;
    }
    .waiting-label { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.08em; }
    .online-lbl  { font-size: 0.62rem; color: var(--green);  margin-top: 4px; }
    .offline-lbl { font-size: 0.62rem; color: var(--muted);  margin-top: 4px; }

    /* Pick form */
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label {
      font-size: 0.56rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    }
    .form-select, .form-input {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-family: 'DM Mono', monospace;
      font-size: 0.78rem; padding: 7px 9px; width: 100%; outline: none;
      transition: border-color 0.15s;
    }
    .form-select:focus, .form-input:focus { border-color: var(--purple); }
    .form-select option { background: var(--bg); }

    /* Complete */
    .complete-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.5rem; text-align: center;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .complete-icon { font-size: 2rem; }
    .complete-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem;
      letter-spacing: 0.1em; color: var(--yellow);
    }
    .complete-sub { font-size: 0.68rem; color: var(--muted); }

    /* My picks summary */
    .my-picks-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.9rem 1.1rem;
    }
    .my-pick-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 3px 0; font-size: 0.68rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .my-pick-row:last-child { border-bottom: none; }
    .my-pick-cat { color: var(--muted); }
    .my-pick-team { font-weight: 500; }
    .my-pick-row.empty .my-pick-team { color: var(--muted); opacity: 0.35; }

    /* Admin */
    .admin-card {
      background: rgba(245,158,11,0.03); border: 1px solid rgba(245,158,11,0.18);
      border-radius: 12px; padding: 0.9rem 1.1rem;
    }
    .admin-btns { display: flex; gap: 0.5rem; margin-top: 0.5rem; }

    /* ── GRID ────────────────────────────────────────────────── */
    .grid-wrap {
      flex: 1; overflow-x: auto; min-width: 0;
      border: 1px solid var(--border); border-radius: 12px;
    }
    .draft-grid {
      border-collapse: separate; border-spacing: 0;
      width: 100%; min-width: 860px;
    }
    .draft-grid th { position: sticky; top: 0; z-index: 3; }

    .grid-player-hdr {
      background: var(--surface2); color: var(--muted);
      font-size: 0.56rem; font-weight: 500; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 8px 10px;
      left: 0; z-index: 4;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .grid-cat-hdr {
      background: var(--surface2); color: var(--muted);
      font-size: 0.6rem; font-weight: 500; letter-spacing: 0.06em;
      text-align: center; padding: 8px 4px; min-width: 68px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      border-right: 1px solid rgba(255,255,255,0.04);
    }
    .grid-player {
      background: var(--surface); font-size: 0.75rem; font-weight: 500;
      padding: 7px 10px; position: sticky; left: 0; z-index: 1;
      display: flex; align-items: center; gap: 5px; min-width: 88px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .grid-cell {
      font-size: 0.68rem; text-align: center; padding: 7px 3px;
      background: var(--bg); color: var(--text);
      border-bottom: 1px solid rgba(255,255,255,0.03);
      border-right: 1px solid rgba(255,255,255,0.03);
    }
    .grid-cell.empty { color: transparent; }
    .grid-cell.empty::after { content: '—'; color: rgba(255,255,255,0.07); }

    .current-row .grid-player {
      background: rgba(168,85,247,0.12); color: var(--purple);
      border-right-color: rgba(168,85,247,0.25);
    }
    .current-row .grid-cell {
      background: rgba(168,85,247,0.04);
      border-bottom-color: rgba(168,85,247,0.12);
    }
    .my-row .grid-player { background: rgba(255,255,255,0.03); }

    /* ── BUTTONS ─────────────────────────────────────────────── */
    .btn-primary {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-family: 'DM Mono', monospace;
      font-size: 0.7rem; padding: 7px 14px; cursor: pointer;
      transition: background 0.15s; margin-top: 0.5rem; width: 100%;
    }
    .btn-primary:hover { background: rgba(255,255,255,0.07); }

    .btn-accent {
      background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.32);
      border-radius: 8px; color: var(--purple); font-family: 'DM Mono', monospace;
      font-size: 0.76rem; padding: 9px 16px; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-accent:hover { background: rgba(168,85,247,0.18); }

    .btn-pick {
      width: 100%; background: var(--purple); color: white; border: none;
      border-radius: 8px; padding: 9px; font-family: 'DM Mono', monospace;
      font-size: 0.76rem; font-weight: 500; letter-spacing: 0.07em;
      cursor: pointer; transition: background 0.15s; margin-top: 0.6rem;
    }
    .btn-pick:hover { background: #9333ea; }
    .btn-pick:disabled { opacity: 0.5; cursor: default; }

    .btn-admin {
      flex: 1; background: var(--surface2); border: 1px solid rgba(245,158,11,0.22);
      border-radius: 6px; color: var(--yellow); font-family: 'DM Mono', monospace;
      font-size: 0.66rem; padding: 6px 10px; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-admin:hover { background: rgba(245,158,11,0.1); }
  </style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<script>
// ── CONFIG ──────────────────────────────────────────────────────
// After creating your Supabase project, replace these two values.
const SUPABASE_URL  = 'https://YOUR_PROJECT.supabase.co';
const SUPABASE_ANON = 'YOUR_ANON_KEY';

const SESSION_ID    = 'FL-2026';
const ADMIN_PLAYERS = ['Korch'];
const TIMER_SECONDS = 120;

const PLAYERS = [
  'Tim','Wu','Jens','Todd','Mitchell','Shep','Theo',
  'Feder','Fryar','Korch','Molmen','Jamzee','Buckley'
];
const CATEGORIES = [
  'NFL','NBA','MLB','NHL','NCAAF','NCAAB',
  'Tennis','Golf','NASCAR','MLS',
  'Actor','Actress','Musician','Stock','Country'
];

// ── SUPABASE ────────────────────────────────────────────────────
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON);

// ── STATE ───────────────────────────────────────────────────────
let me             = localStorage.getItem('fl_draft_player');
let session        = null;
let picks          = [];
let onlinePlayers  = new Set();
let timerInterval  = null;
let presenceCh     = null;
let dragSrcIdx     = null;
let localOrder     = null;   // admin-only, pending order before save

// ── INIT ────────────────────────────────────────────────────────
async function init() {
  if (SUPABASE_URL.includes('YOUR_PROJECT')) {
    document.getElementById('app').innerHTML = `
      <div class="error-msg">
        <strong>Setup required:</strong> Open <code>draft.html</code> and replace
        <code>SUPABASE_URL</code> and <code>SUPABASE_ANON</code> with your project
        credentials, then run <code>docs/draft-schema.sql</code> in the Supabase SQL editor.
      </div>`;
    return;
  }

  // Load or create session
  let { data, error } = await db
    .from('draft_sessions').select('*').eq('id', SESSION_ID).maybeSingle();

  if (!data) {
    const res = await db
      .from('draft_sessions')
      .insert({ id: SESSION_ID, draft_order: PLAYERS, status: 'setup' })
      .select().single();
    if (res.error) {
      document.getElementById('app').innerHTML =
        `<div class="error-msg">DB error: ${res.error.message}<br>Did you run draft-schema.sql?</div>`;
      return;
    }
    data = res.data;
  }
  session = normalise(data);

  // Load picks
  const { data: pd } = await db
    .from('draft_picks').select('*').eq('session_id', SESSION_ID)
    .order('pick_number');
  picks = pd || [];

  // Realtime — session changes
  db.channel('rt-session')
    .on('postgres_changes', {
      event: 'UPDATE', schema: 'public', table: 'draft_sessions',
      filter: `id=eq.${SESSION_ID}`
    }, payload => { session = normalise(payload.new); render(); })
    .subscribe();

  // Realtime — new picks
  db.channel('rt-picks')
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'draft_picks',
      filter: `session_id=eq.${SESSION_ID}`
    }, payload => {
      if (!picks.find(p => p.id === payload.new.id)) picks.push(payload.new);
      render();
    })
    .subscribe();

  // Presence
  presenceCh = db.channel('fl-draft-presence');
  presenceCh
    .on('presence', { event: 'sync' }, () => {
      onlinePlayers = new Set();
      Object.values(presenceCh.presenceState()).forEach(arr =>
        arr.forEach(p => { if (p.player) onlinePlayers.add(p.player); })
      );
      render();
    })
    .subscribe(async status => {
      if (status === 'SUBSCRIBED' && me) await presenceCh.track({ player: me });
    });

  render();
}

function normalise(s) {
  if (s && !Array.isArray(s.draft_order)) s.draft_order = PLAYERS;
  return s;
}

// ── DRAFT MATH ──────────────────────────────────────────────────

function currentPicker() {
  if (!session || session.status === 'setup' || session.status === 'complete') return null;
  const order = session.draft_order;
  const idx   = session.current_pick_idx || 0;
  if (session.status === 'keeper') return order[idx % order.length];
  const round = Math.floor(idx / order.length);
  const pos   = idx % order.length;
  return round % 2 === 0 ? order[pos] : order[order.length - 1 - pos];
}

function phaseTotal() {
  const n = (session?.draft_order || PLAYERS).length;
  if (session?.status === 'keeper') return n;
  if (session?.status === 'draft')  return n * (CATEGORIES.length - 1);  // 13×14 = 182
  return 0;
}

function myPicked()    { return picks.filter(p => p.player === me).map(p => p.category); }
function myAvailable() { const t = new Set(myPicked()); return CATEGORIES.filter(c => !t.has(c)); }

function isMyTurn() {
  return !!me && currentPicker() === me && !session?.paused && session?.status !== 'complete';
}

function timerRemaining() {
  if (!session?.pick_started_at) return TIMER_SECONDS;
  const start   = new Date(session.pick_started_at).getTime();
  const endTime = session.paused && session.paused_at
    ? new Date(session.paused_at).getTime()
    : Date.now();
  return Math.max(0, TIMER_SECONDS - (endTime - start) / 1000);
}

// ── ACTIONS ─────────────────────────────────────────────────────

async function submitPick(category, team) {
  const t = (team || '').trim();
  if (!category) { showAlert('Choose a category.'); return; }
  if (!t)        { showAlert('Enter a team name.'); return; }

  const dupe = picks.find(p =>
    p.category === category && p.team.toLowerCase() === t.toLowerCase()
  );
  if (dupe) { showAlert(`${t} is already taken in ${category} by ${dupe.player}.`); return; }
  if (myPicked().includes(category)) { showAlert(`You already have a ${category} pick.`); return; }

  const btn = document.getElementById('pick-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  const { error } = await db.from('draft_picks').insert({
    session_id: SESSION_ID, player: me,
    category, team: t, phase: session.status,
    pick_number: picks.length + 1
  });

  if (error) { showAlert('Save failed: ' + error.message); if (btn) { btn.disabled = false; btn.textContent = 'CONFIRM PICK'; } return; }

  await advance();
}

async function advance() {
  const nextIdx = (session.current_pick_idx || 0) + 1;
  const total   = phaseTotal();
  const update  = { current_pick_idx: nextIdx, pick_started_at: new Date().toISOString(), paused_at: null, paused: false };
  if (nextIdx >= total) {
    if (session.status === 'keeper') { update.status = 'draft'; update.current_pick_idx = 0; }
    else                              { update.status = 'complete'; }
  }
  await db.from('draft_sessions').update(update).eq('id', SESSION_ID);
}

async function skipPick() {
  if (!ADMIN_PLAYERS.includes(me) && !isMyTurn()) return;
  await advance();
}

async function togglePause() {
  if (!ADMIN_PLAYERS.includes(me)) return;
  if (session.paused) {
    // Resume: adjust pick_started_at so elapsed time is preserved
    const elapsed = session.paused_at && session.pick_started_at
      ? (new Date(session.paused_at) - new Date(session.pick_started_at))
      : 0;
    const newStart = new Date(Date.now() - elapsed).toISOString();
    await db.from('draft_sessions').update({ paused: false, paused_at: null, pick_started_at: newStart }).eq('id', SESSION_ID);
  } else {
    await db.from('draft_sessions').update({ paused: true, paused_at: new Date().toISOString() }).eq('id', SESSION_ID);
  }
}

async function startPhase(phase) {
  if (!ADMIN_PLAYERS.includes(me)) return;
  await db.from('draft_sessions').update({
    status: phase, current_pick_idx: 0, paused: false,
    paused_at: null, pick_started_at: new Date().toISOString()
  }).eq('id', SESSION_ID);
}

// ── RENDER ──────────────────────────────────────────────────────

function render() {
  const app = document.getElementById('app');
  if (!session) return;
  if (!me)                          { app.innerHTML = renderLogin();  return; }
  if (session.status === 'setup')   { app.innerHTML = renderLobby();  attachLobby(); return; }
  app.innerHTML = renderBoard();
  attachBoard();
  tickTimer();
}

// LOGIN ──────────────────────────────────────────────────────────
function renderLogin() {
  return `<div class="login-wrap">
    <div class="login-title">FL DRAFT 2026</div>
    <div class="login-sub">Who are you?</div>
    <div class="player-grid">
      ${PLAYERS.map(p => `<button class="player-btn" data-player="${p}">${p}</button>`).join('')}
    </div>
  </div>`;
}

// LOBBY ──────────────────────────────────────────────────────────
function renderLobby() {
  const order   = session.draft_order || PLAYERS;
  const isAdmin = ADMIN_PLAYERS.includes(me);
  const online  = PLAYERS.filter(p => onlinePlayers.has(p));
  const offline = PLAYERS.filter(p => !onlinePlayers.has(p));

  return `<div class="lobby-wrap">
    <div class="lobby-header">
      <div class="lobby-title">FL DRAFT 2026</div>
      <div class="lobby-you">
        ${me} <a class="change-link" href="#" id="logout-link">[change]</a>
      </div>
    </div>

    <div class="lobby-cols">
      <div class="card">
        <span class="card-label">Draft Order ${isAdmin ? '· drag to reorder' : ''}</span>
        <div class="order-list" id="order-list">
          ${order.map((p,i) => `
            <div class="order-item" data-player="${p}" data-index="${i}" draggable="${isAdmin}">
              <span class="order-num">${i+1}</span>
              <span class="order-name">${p}</span>
              <span class="dot ${onlinePlayers.has(p) ? 'online' : 'offline'}"></span>
            </div>`).join('')}
        </div>
        ${isAdmin
          ? `<button class="btn-primary" id="save-order-btn">Save Order</button>`
          : `<div class="lobby-hint">Only the admin can reorder</div>`}
      </div>

      <div class="card">
        <span class="card-label">Online (${online.length} / 13)</span>
        ${online.map(p => `<div class="presence-item"><span class="dot online"></span>${p}</div>`).join('')}
        ${offline.length ? `<span class="card-label" style="margin-top:0.8rem">Offline</span>` : ''}
        ${offline.map(p => `<div class="presence-item muted"><span class="dot offline"></span>${p}</div>`).join('')}
      </div>
    </div>

    ${isAdmin ? `
      <div class="admin-actions">
        <button class="btn-accent" id="start-keeper-btn">▶ Start Keeper Round</button>
        <button class="btn-accent" style="border-color:rgba(100,116,139,0.35);color:var(--muted)"
          id="start-draft-btn">Skip keepers → Start Draft</button>
      </div>
    ` : `<div class="waiting-msg">Waiting for admin to start the draft…</div>`}
  </div>`;
}

// BOARD ──────────────────────────────────────────────────────────
function renderBoard() {
  const order   = session.draft_order || PLAYERS;
  const picker  = currentPicker();
  const myTurn  = isMyTurn();
  const isAdmin = ADMIN_PLAYERS.includes(me);
  const avail   = myAvailable();
  const rem     = timerRemaining();
  const timerColor = rem < 30 ? 'var(--red)' : rem < 60 ? 'var(--yellow)' : 'var(--green)';
  const timerStr   = `${Math.floor(rem/60)}:${String(Math.floor(rem%60)).padStart(2,'0')}`;
  const phaseLabel = session.status === 'keeper' ? 'KEEPER ROUND'
                   : session.status === 'draft'  ? 'SNAKE DRAFT' : 'COMPLETE';
  const roundNum   = session.status === 'draft'
    ? Math.floor((session.current_pick_idx||0) / order.length) + 1 : null;

  // Build grid: player → category → team
  const grid = {};
  order.forEach(p => { grid[p] = {}; });
  picks.forEach(pk => { if (grid[pk.player]) grid[pk.player][pk.category] = pk.team; });

  // ── Left panel ──
  let leftContent = '';
  if (session.status === 'complete') {
    leftContent = `<div class="complete-card">
      <div class="complete-icon">🏆</div>
      <div class="complete-title">DRAFT COMPLETE</div>
      <div class="complete-sub">${picks.length} total picks</div>
    </div>`;
  } else {
    leftContent = `
      <div class="timer-card${session.paused ? ' paused' : ''}">
        <div class="timer-label">${session.paused ? 'PAUSED' : 'TIME REMAINING'}</div>
        <div class="timer-display" id="timer-display" style="color:${timerColor}">${timerStr}</div>
        <div class="timer-sub">${picker || ''}</div>
      </div>`;

    if (myTurn) {
      leftContent += `
        <div class="your-turn-card">
          <div class="your-turn-title">YOUR PICK</div>
          <div class="your-turn-sub">${avail.length} of ${CATEGORIES.length} left</div>
          <form id="pick-form">
            <div class="form-group">
              <label class="form-label">Category</label>
              <select id="pick-cat" class="form-select">
                <option value="">— choose —</option>
                ${avail.map(c => `<option value="${c}">${c}</option>`).join('')}
              </select>
            </div>
            <div class="form-group" style="margin-top:0.5rem">
              <label class="form-label">Team / Pick</label>
              <input id="pick-team" class="form-input" type="text"
                placeholder="e.g. Spurs" autocomplete="off" />
            </div>
            <button type="submit" class="btn-pick" id="pick-submit">CONFIRM PICK</button>
          </form>
        </div>`;
    } else if (picker) {
      leftContent += `
        <div class="waiting-card">
          <div class="waiting-name">${picker}</div>
          <div class="waiting-label">is on the clock</div>
          <div class="${onlinePlayers.has(picker) ? 'online' : 'offline'}-lbl">
            ${onlinePlayers.has(picker) ? '● online' : '○ offline'}
          </div>
        </div>`;
    }
  }

  // My picks summary
  const myPicksRows = CATEGORIES.map(c => {
    const t = grid[me]?.[c] || '';
    return `<div class="my-pick-row ${t ? 'filled' : 'empty'}">
      <span class="my-pick-cat">${c}</span>
      <span class="my-pick-team">${t || '—'}</span>
    </div>`;
  }).join('');

  leftContent += `
    <div class="my-picks-card">
      <span class="card-label">${me}'s picks</span>
      ${myPicksRows}
    </div>`;

  if (isAdmin && session.status !== 'complete') {
    leftContent += `
      <div class="admin-card">
        <span class="card-label">Admin</span>
        <div class="admin-btns">
          <button class="btn-admin" id="skip-btn">Skip Pick</button>
          <button class="btn-admin" id="pause-btn">${session.paused ? 'Resume' : 'Pause'}</button>
        </div>
      </div>`;
  }

  // ── Grid ──
  const gridRows = order.map(player => {
    const isCurrent = player === picker;
    const isMe2     = player === me;
    const cells = CATEGORIES.map(cat => {
      const team = grid[player]?.[cat] || '';
      return `<td class="grid-cell ${team ? 'filled' : 'empty'}">${team}</td>`;
    }).join('');
    return `<tr class="${isCurrent ? 'current-row' : ''} ${isMe2 ? 'my-row' : ''}">
      <td class="grid-player">
        <span class="dot-sm ${onlinePlayers.has(player) ? 'online' : 'offline'}"></span>
        ${player}
      </td>
      ${cells}
    </tr>`;
  }).join('');

  return `<div class="board-wrap">
    <div class="board-header">
      <div class="board-title">FL DRAFT 2026</div>
      <div class="board-meta">
        <span class="badge badge-purple">${phaseLabel}</span>
        ${roundNum ? `<span class="badge badge-muted">Round ${roundNum}</span>` : ''}
        ${session.status !== 'complete'
          ? `<span class="badge badge-muted">Pick ${picks.length + 1}</span>` : ''}
      </div>
      <div class="board-you">
        ${me}${isAdmin ? ` <span class="badge-yellow">admin</span>` : ''}
        <a class="change-link" href="#" id="logout-link">[change]</a>
      </div>
    </div>

    <div class="board-layout">
      <div class="left-panel">${leftContent}</div>

      <div class="grid-wrap">
        <table class="draft-grid">
          <thead>
            <tr>
              <th class="grid-player-hdr">Player</th>
              ${CATEGORIES.map(c => `<th class="grid-cat-hdr">${c}</th>`).join('')}
            </tr>
          </thead>
          <tbody>${gridRows}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

// ── EVENT WIRING ─────────────────────────────────────────────────

// Login: event delegation (always attached)
document.getElementById('app').addEventListener('click', e => {
  const btn = e.target.closest('.player-btn');
  if (!btn) return;
  me = btn.dataset.player;
  localStorage.setItem('fl_draft_player', me);
  if (presenceCh) presenceCh.track({ player: me });
  render();
});

function attachBoard() {
  document.getElementById('logout-link')?.addEventListener('click', logout);
  document.getElementById('pick-form')?.addEventListener('submit', async e => {
    e.preventDefault();
    await submitPick(
      document.getElementById('pick-cat')?.value,
      document.getElementById('pick-team')?.value
    );
  });
  document.getElementById('skip-btn')?.addEventListener('click', skipPick);
  document.getElementById('pause-btn')?.addEventListener('click', togglePause);
}

function attachLobby() {
  document.getElementById('logout-link')?.addEventListener('click', logout);
  document.getElementById('save-order-btn')?.addEventListener('click', async () => {
    if (!localOrder) return;
    await db.from('draft_sessions').update({ draft_order: localOrder }).eq('id', SESSION_ID);
  });
  document.getElementById('start-keeper-btn')?.addEventListener('click', () => startPhase('keeper'));
  document.getElementById('start-draft-btn')?.addEventListener('click', () => startPhase('draft'));
  if (ADMIN_PLAYERS.includes(me)) initDragDrop();
}

function logout(e) {
  e?.preventDefault();
  me = null;
  localStorage.removeItem('fl_draft_player');
  render();
}

// ── DRAG-AND-DROP (lobby order list) ────────────────────────────

function initDragDrop() {
  localOrder = [...(session.draft_order || PLAYERS)];
  const list = document.getElementById('order-list');
  if (!list) return;

  list.addEventListener('dragstart', e => {
    const item = e.target.closest('.order-item');
    if (!item) return;
    dragSrcIdx = +item.dataset.index;
    setTimeout(() => item.classList.add('dragging'), 0);
  });
  list.addEventListener('dragend', () => {
    list.querySelectorAll('.order-item').forEach(el =>
      el.classList.remove('dragging', 'drag-over')
    );
  });
  list.addEventListener('dragover', e => {
    e.preventDefault();
    list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    e.target.closest('.order-item')?.classList.add('drag-over');
  });
  list.addEventListener('dragleave', e => {
    e.target.closest('.order-item')?.classList.remove('drag-over');
  });
  list.addEventListener('drop', e => {
    e.preventDefault();
    const target = e.target.closest('.order-item');
    if (!target || dragSrcIdx === null) return;
    const dest = +target.dataset.index;
    list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    if (dragSrcIdx === dest) return;

    const [moved] = localOrder.splice(dragSrcIdx, 1);
    localOrder.splice(dest, 0, moved);
    dragSrcIdx = null;

    // Re-render order list in place without full render()
    list.innerHTML = localOrder.map((p, i) => `
      <div class="order-item" data-player="${p}" data-index="${i}" draggable="true">
        <span class="order-num">${i+1}</span>
        <span class="order-name">${p}</span>
        <span class="dot ${onlinePlayers.has(p) ? 'online' : 'offline'}"></span>
      </div>`).join('');
    initDragDrop();   // re-attach on the new nodes
  });
}

// ── TIMER ────────────────────────────────────────────────────────

function tickTimer() {
  if (timerInterval) clearInterval(timerInterval);
  if (!session || session.status === 'complete') return;

  timerInterval = setInterval(() => {
    const display = document.getElementById('timer-display');
    if (!display) { clearInterval(timerInterval); return; }

    if (session.paused) return;   // freeze display while paused

    const rem = timerRemaining();
    display.textContent = `${Math.floor(rem/60)}:${String(Math.floor(rem%60)).padStart(2,'0')}`;
    display.style.color = rem < 30 ? 'var(--red)' : rem < 60 ? 'var(--yellow)' : 'var(--green)';

    if (rem <= 0 && isMyTurn()) {
      clearInterval(timerInterval);
      skipPick();
    }
  }, 500);
}

// ── HELPERS ──────────────────────────────────────────────────────

function showAlert(msg) {
  alert(msg);
}

// ── BOOT ─────────────────────────────────────────────────────────
init();
</script>
