<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fantasy Life 2026 — Calendar</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./shared.css">
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #13161d;
      --surface2: #1a1e28;
      --border: #232733;
      --blue: #2d7dd2;
      --blue-dim: #1a4a82;
      --text: #f0f2f8;
      --muted: #9aa3b5;
      --dim: #6b7280;
      --green: #22c55e;
      --red: #ef4444;
      --gold: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      line-height: 1.75;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.08em;
      color: var(--text);
      text-decoration: none;
    }
    .logo span { color: var(--blue); }
    .header-logo-img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      background-size: cover;
      background-position: center top;
      background-image: url('./todd.jpg');
    }
    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.7rem;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .nav-link:hover { color: var(--text); }
    .nav-link.active { color: var(--blue); }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .page-title span { color: var(--blue); }

    .page-subtitle {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 48px;
      font-family: 'DM Mono', monospace;
    }

    /* Month section */
    .month-section {
      margin-bottom: 40px;
    }

    .month-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .month-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      color: var(--text);
    }

    .month-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .month-past .month-name { color: var(--muted); }
    .completed-months-header {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
      border-top: 1px solid var(--border);
      padding-top: 32px;
      margin-top: 16px;
      margin-bottom: 8px;
    }

    /* Event card */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .event-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      border-left: 3px solid var(--border);
      transition: border-color 0.15s;
    }

    .event-card.status-past {
      opacity: 0.55;
      border-left-color: var(--dim);
    }

    .event-card.status-live {
      border-left-color: var(--green);
      background: #0b1f10;
    }

    .event-card.status-upcoming {
      border-left-color: var(--blue);
    }

    .event-cat-badge {
      font-size: 0.65rem;
      font-family: 'DM Mono', monospace;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 3px 7px;
      border-radius: 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Category badge colors */
    .cat-nfl      { background: #1a2a14; color: #4ade80; }
    .cat-nba      { background: #1a1400; color: #f59e0b; }
    .cat-mlb      { background: #1a0d00; color: #fb923c; }
    .cat-nhl      { background: #0d1a2a; color: #60a5fa; }
    .cat-ncaaf    { background: #1a0d1a; color: #c084fc; }
    .cat-ncaab    { background: #1a1400; color: #fbbf24; }
    .cat-tennis   { background: #1a1a0d; color: #d9f99d; }
    .cat-golf     { background: #0d1a12; color: #6ee7b7; }
    .cat-nascar   { background: #1a0d0d; color: #fca5a5; }
    .cat-mls      { background: #0d1a1a; color: #67e8f9; }
    .cat-fifa     { background: #051a08; color: #4ade80; }
    .cat-actor    { background: #1a0d1a; color: #e879f9; }
    .cat-actress  { background: #1a0d1a; color: #f0abfc; }
    .cat-musician { background: #0d0d1a; color: #a5b4fc; }
    .cat-stock    { background: #0d1a0d; color: #86efac; }
    .cat-country  { background: #1a1200; color: #fde68a; }
    .cat-multi    { background: #1a1414; color: #d1d5db; }

    .event-info {
      flex: 1;
      min-width: 0;
    }

    .event-name {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-card.status-past .event-name { color: var(--muted); }

    .event-detail {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
      font-family: 'DM Mono', monospace;
    }

    .event-date {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-past .status-dot    { background: var(--dim); }
    .status-live .status-dot    { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 1.5s ease-in-out infinite; }
    .status-upcoming .status-dot { background: var(--blue); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    @media (max-width: 600px) {
      .page { padding: 24px 12px 60px; }
      .event-card { gap: 10px; padding: 10px 12px; }
      .event-cat-badge { display: none; }
      .event-name { font-size: 0.95rem; white-space: normal; }
    }

    /* ─── SITE NAV BAR ─── */
    /* .site-nav styles: shared.css */
  </style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="./index.html" class="header-logo-img"></a>
    <a href="./index.html" class="logo" style="text-decoration:none;">Fantasy<span>Life</span></a>
  </div>
</header>
<nav class="site-nav">
  <a href="./index.html" class="nav-link">Leaderboard</a>
  <a href="./rules.html" class="nav-link">Rules</a>
  <a href="./calendar.html" class="nav-link active">Calendar</a>
  <a href="./trips.html" class="nav-link">Trips</a>
  <a href="./projections.html" class="nav-link">Projections</a>
  <a href="./draft.html" class="nav-link">Draft</a>
  <a href="./sportsbook.html" class="nav-link">Sportsbook</a>
  <a href="./index.html?season=2027" class="nav-link" id="nav-standings-2027">2027 Standings</a>
  <a href="./projections.html?season=2027" class="nav-link" id="nav-proj-2027">2027 Projections</a>
</nav>

<div class="page">

  <div class="page-title">2026 <span>Calendar</span></div>
  <div class="page-subtitle">Notable events across all Fantasy Life categories</div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--dim)"></div>Completed</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--green);box-shadow:0 0 5px var(--green)"></div>Live / In Progress</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>Upcoming</div>
  </div>

  <!-- Cards are rendered from calendar.json — the single league calendar that the FL News headline and the
       projections also read. Status (completed / live / upcoming) is computed from today's date, never typed. -->
  <div id="calendar-months"><div class="month-section"><div class="event-detail">Loading calendar…</div></div></div>

</div>

<div style="text-align:center; padding: 1.5rem 1rem; color: var(--muted); font-size: 0.85rem;">
  Questions? Contact <a href="mailto:tgrover8@gmail.com" style="color: var(--blue); text-decoration: none;">customer service</a>.
</div>
<script>
(function () {
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  // "Today" in US Eastern, as YYYY-MM-DD, so a card flips status at Eastern midnight like the rest of the league.
  const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());
  const status = e => e.end < today ? 'past' : e.start > today ? 'upcoming' : 'live';
  const card = e => {
    const st = status(e);
    const trip = e.category === 'trip';
    return `<div class="event-card status-${st}"${trip ? ' style="border-left-color:var(--gold);"' : ''}>
        <div class="status-dot"${trip ? ' style="background:var(--gold);"' : ''}></div>
        <div class="event-cat-badge ${trip ? '' : 'cat-' + e.category}"${trip ? ' style="background:#1a1200;color:var(--gold);"' : ''}>${e.badge}</div>
        <div class="event-info">
          <div class="event-name">${e.name}</div>
          ${e.detail ? `<div class="event-detail">${e.detail}</div>` : ''}
        </div>
        <div class="event-date">${e.label}</div>
      </div>`;
  };
  const section = (key, evs, past) => {
    const m = MONTHS[+key.slice(5, 7) - 1];
    return `<div class="month-section${past ? ' month-past' : ''}">
    <div class="month-header"><div class="month-name">${m}</div><div class="month-line"></div></div>
    <div class="events-list">${evs.map(card).join('')}</div>
  </div>`;
  };
  fetch('./calendar.json').then(r => r.json()).then(cal => {
    // Group by the month an event starts in (YYYY-MM).
    const byMonth = {};
    cal.events.forEach(e => { (byMonth[e.start.slice(0, 7)] = byMonth[e.start.slice(0, 7)] || []).push(e); });
    Object.values(byMonth).forEach(l => l.sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end)));
    const cur = today.slice(0, 7);
    // Current month first, then upcoming months in order, then completed months newest first (same layout as before).
    const keys = Object.keys(byMonth).sort();
    const ahead = keys.filter(k => k >= cur);
    const behind = keys.filter(k => k < cur).reverse();
    document.getElementById('calendar-months').innerHTML =
      ahead.map(k => section(k, byMonth[k], false)).join('') +
      (behind.length ? '<div class="completed-months-header">Completed Months</div>' : '') +
      behind.map(k => section(k, byMonth[k], true)).join('');
  }).catch(() => {
    document.getElementById('calendar-months').innerHTML =
      '<div class="month-section"><div class="event-detail">Could not load calendar.json.</div></div>';
  });
})();
</script>
</body>
</html>
