name: FL Headline (manual)

# Scheduled headline generation now lives in daily.yml (one commit per day
# instead of two racing workflows). This workflow is for manual regeneration
# only — it always passes --force to bypass the dedup guard.
on:
  workflow_dispatch:        # "Run workflow" button in GitHub Actions UI
    inputs:
      dry_run:
        description: 'Preview only — print queries, snippets, and headline without writing scores.json'
        type: boolean
        default: false

jobs:
  headline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt requests

      - name: Generate FL News headline
        continue-on-error: true   # API credit exhaustion must not fail the workflow
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 headline.py --force --debug ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit & push headline
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/scores.json
          git diff --staged --quiet || git commit -m "chore: FL News headline $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X ours origin main
          git push
