name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe Billboard Wikipedia tables
        run: |
          python - <<'PY'
          from scrapers import fetch_html
          picks = ['Kendrick','FKA','Sabrina','Olivia','Bad Bunny','Drake','BTS','Gaga','Bieber','SZA','Swift','Weeknd','Beyonc']
          print('=== #1 PAGE (every row: [tag rowspan text]) ===')
          s1 = fetch_html('https://en.wikipedia.org/wiki/List_of_Billboard_Hot_100_number_ones_of_2026', timeout=20)
          for ti, t in enumerate(s1.select('table.wikitable')):
              print('table', ti)
              for r in t.select('tr'):
                  cells = r.find_all(['td','th'])
                  print(len(cells), [(c.name, c.get('rowspan'), c.get_text(' ', strip=True)[:40]) for c in cells])
          print('=== TOP-10 PAGE (rows mentioning a pick, plus first 3 rows) ===')
          s2 = fetch_html('https://en.wikipedia.org/wiki/List_of_Billboard_Hot_100_top-ten_singles_in_2026', timeout=20)
          for ti, t in enumerate(s2.select('table.wikitable')):
              rows = t.select('tr')
              print('table', ti, 'rows', len(rows))
              for i, r in enumerate(rows):
                  cells = r.find_all(['td','th'])
                  txt = ' '.join(c.get_text(' ', strip=True) for c in cells)
                  if i < 3 or any(p.lower() in txt.lower() for p in picks):
                      print(i, len(cells), [(c.name, c.get('rowspan'), c.get_text(' ', strip=True)[:40]) for c in cells])
          PY
