name: Probe Scraper Sources

# Manual-only diagnostic: GET each candidate data source from the Actions runner
# (which has open internet + secrets, unlike the dev sandbox) and print what's
# found. Saves nothing to Supabase and writes no files.
#   scrapers → python scrapers.py --probe   (golf/NASCAR/MLS data endpoints)
#   kalshi   → python projections.py --probe (series catalog, market field
#              shapes, KNOWN_SERIES ticker health + pick matching)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe candidate sources
        if: ${{ inputs.mode == 'scrapers' }}
        run: python scrapers.py --probe

      - name: Probe Kalshi series + markets
        if: ${{ inputs.mode == 'kalshi' }}
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python projections.py --probe
