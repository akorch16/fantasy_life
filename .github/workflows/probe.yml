name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "DBnomics IMF WEO vintages"
        run: |
          python - <<'PY'
          import requests, json
          H = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125 Safari/537.36'}
          r = requests.get('https://api.db.nomics.world/v22/datasets/IMF?q=WEO&limit=100', headers=H, timeout=60)
          print('DATASETS', r.status_code)
          codes = []
          try:
              for d in r.json()['datasets']['docs']:
                  codes.append(d['code'])
              print('CODES', [c for c in codes if c.startswith('WEO')])
          except Exception as e:
              print('ERR', repr(e), r.text[:300])
          for ds in ['WEO:2026-04', 'WEO:2025-10']:
              u = f'https://api.db.nomics.world/v22/series/IMF/{ds}?dimensions=%7B%22weo-subject%22%3A%5B%22NGDP_RPCH%22%5D%7D&limit=500&observations=1&format=json'
              out = {}
              try:
                  rr = requests.get(u, headers=H, timeout=90)
                  print('SERIES', ds, rr.status_code, len(rr.text))
                  if rr.status_code == 200:
                      j = rr.json()
                      print('NUMFOUND', j['series']['num_found'])
                      for s in j['series']['docs']:
                          per = s.get('period') or []
                          val = s.get('value') or []
                          m = dict(zip(per, val))
                          lab = s.get('series_name') or s.get('series_code')
                          out[s.get('series_code')] = {'name': lab, '2025': m.get('2025'), '2026': m.get('2026'), '2027': m.get('2027')}
                      print('IMFJSON-' + ds + '>>' + json.dumps(out) + '<<IMFJSON')
              except Exception as e:
                  print('ERR', ds, repr(e)[:200])
          PY
