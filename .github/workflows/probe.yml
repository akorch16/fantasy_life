name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Hot 100 top-30, every 2026 issue"
        run: |
          python - <<'PY'
          import requests, time, json, datetime
          from bs4 import BeautifulSoup
          d = datetime.date(2026, 1, 3)
          today = datetime.date.today()
          out = []
          while d.year == 2026 and d - datetime.timedelta(days=4) <= today:
              rows = []
              for attempt in range(3):
                  try:
                      r = requests.get(f'https://www.billboard.com/charts/hot-100/{d.isoformat()}/', headers={'User-Agent': 'Mozilla/5.0'}, timeout=40)
                      soup = BeautifulSoup(r.text, 'html.parser')
                      for rank, row in enumerate(soup.select('ul.o-chart-results-list-row')[:30], 1):
                          t = row.select_one('h3#title-of-a-story')
                          if not t: continue
                          a = t.find_next('span')
                          rows.append([rank, t.get_text(strip=True), a.get_text(strip=True) if a else ''])
                      if len(rows) >= 10: break
                  except Exception as e:
                      print('ERR', d, repr(e)[:100])
                  time.sleep(2)
              out.append([d.isoformat(), rows])
              time.sleep(0.4)
              d += datetime.timedelta(days=7)
          print('WEEKS', len(out), [ (w[0], len(w[1])) for w in out][-3:])
          for w in out:
              print('HOT>>' + json.dumps(w, ensure_ascii=False) + '<<HOT')
          PY
