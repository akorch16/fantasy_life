name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: "api.imf.org WEO"
        run: |
          python - <<'PY'
          import requests, json, re
          import xml.etree.ElementTree as ET
          H = {'User-Agent': 'Mozilla/5.0'}
          B = 'https://api.imf.org/external/sdmx/3.0'
          # 1. dataflow versions + annotations (lastUpdatedAt, publication)
          for u in [B + '/structure/dataflow/IMF.RES/WEO/*', B + '/structure/dataflow/IMF.RES/WEO/+']:
              r = requests.get(u, headers={**H, 'Accept': 'application/json'}, timeout=60)
              print('FLOW', r.status_code, u, len(r.text))
              try:
                  j = r.json()
                  for f in j['data']['dataflows']:
                      ann = {a.get('id'): (a.get('title') or a.get('text') or a.get('value')) for a in f.get('annotations', [])}
                      print('  version', f.get('version'), '| name', f.get('name'), '| ann', json.dumps(ann)[:600])
              except Exception as e:
                  print('  parse', repr(e)[:100], r.text[:400])
          # 2. all countries, real GDP growth, annual
          r = requests.get(B + '/data/dataflow/IMF.RES/WEO/%2B/*.NGDP_RPCH.A', headers=H, timeout=120)
          print('DATA', r.status_code, len(r.content), r.headers.get('content-type'))
          root = ET.fromstring(r.content)
          out = {}
          meta = {}
          for el in root.iter():
              tag = el.tag.split('}')[-1]
              if tag == 'Series':
                  cur = dict(el.attrib); key = cur.get('COUNTRY') or cur.get('REF_AREA') or json.dumps(cur)[:60]
                  out.setdefault(key, {}); meta[key] = cur
              elif tag == 'Obs':
                  tp = el.attrib.get('TIME_PERIOD'); v = el.attrib.get('OBS_VALUE')
                  if tp and tp[:4] in ('2024', '2025', '2026', '2027', '2028'):
                      out[key][tp[:4]] = v
          print('SERIES', len(out), 'example attrs', json.dumps(list(meta.values())[:1])[:600])
          hdr = [el for el in root.iter() if el.tag.split('}')[-1] in ('Prepared', 'ID', 'DataSetID', 'Structure')]
          for h in hdr[:6]:
              print('HDR', h.tag.split('}')[-1], (h.text or '')[:80], json.dumps(h.attrib)[:200])
          print('WEOJSON>>' + json.dumps(out) + '<<WEOJSON')
          PY
