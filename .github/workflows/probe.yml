name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "A. Kalshi markets by series keyword"
        run: |
          python - <<'PY'
          import re, projections as P
          cursor, series = None, []
          for _ in range(30):
              params = {'limit': 1000}
              if cursor: params['cursor'] = cursor
              data = P._kalshi_get('/series', params) or {}
              series += data.get('series', [])
              cursor = data.get('cursor')
              if not cursor: break
          want = re.compile(r'(AFC|NFC)(CHAMP|WIN)|NFL(AFC|NFC)|CONFERENCE (CHAMP|WIN)|(Eastern|Western|East|West).*(Champion|Winner)|Stanley|Grammy|Oscar nomin|nominations for|Hot 100|Billboard Hot|PGA Major|Masters|Open Championship|US Open|Grand Slam|Australian Open|Champion$|NCAA.*(Champ|Title)|College Basketball Champ|World Series|Pennant|League Champion', re.I)
          bad = re.compile(r'Game|Spread|Total|Mention|Player|Quarter|Half|Prop|Receiving|Passing|Rushing|Interception|Tackle|Yards|Touchdown|Sack|Score|Strokes|Round|Playoff Series|Lacrosse|Wrestling|Softball|Baseball Golden|WNBA|Soccer|Cricket|Hockey Player|MVP|Draft|Award|Rookie|Coach|Streak|Leader|Wins$|Delay|Cover|Lawsuit', re.I)
          hit = [s for s in series if want.search((s.get('title') or '') + ' ' + s.get('ticker', '')) and not bad.search(s.get('title') or '')]
          print('candidate series:', len(hit))
          def px(m):
              a, b = m.get('yes_ask_dollars'), m.get('yes_bid_dollars')
              try:
                  if a is not None and b is not None and float(a) > 0: return (float(a) + float(b)) / 2
                  return float(m.get('last_price_dollars') or 0)
              except Exception: return 0
          shown = 0
          for s in hit:
              if shown >= 70: break
              ms = P._fetch_markets_for_series(s['ticker'])
              ms = [m for m in ms if (m.get('close_time') or '')[:4] in ('2026', '2027', '2028', '2029')]
              if not ms: continue
              ms = sorted(ms, key=lambda m: -px(m))
              shown += 1
              print('=====', s['ticker'], '|', (s.get('title') or '')[:70], '| markets', len(ms), '| close', (ms[0].get('close_time') or '')[:10])
              for m in ms[:9]:
                  print('   %.3f' % px(m), '|', m.get('event_ticker'), '|', (m.get('yes_sub_title') or m.get('subtitle') or m.get('title') or '')[:70])
          PY

      - name: "B. Wikipedia 2027 American films (all rows)"
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          H = {'User-Agent': 'Mozilla/5.0'}
          r = requests.get('https://en.wikipedia.org/wiki/List_of_American_films_of_2027', headers=H, timeout=40)
          soup = BeautifulSoup(r.text, 'html.parser')
          n = 0
          for ti, t in enumerate(soup.select('table.wikitable')):
              print('--- table', ti)
              month = ''
              for tr in t.select('tr'):
                  cells = [c.get_text(' ', strip=True) for c in tr.find_all(['td', 'th'])]
                  if not cells: continue
                  print(' | '.join(c[:80] for c in cells[:4]))
                  n += 1
                  if n > 520: break
              if n > 520: break
          PY
