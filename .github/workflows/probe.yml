name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write scenario script
        run: |
          cat > ../scenarios.py <<'PYEOF'
          """Per-winner breakdown for Molmen / Jamzee / Fryar wins, plus Fryar's win rate given Blaney's finish."""
          import inspect, json, sys, textwrap, collections, os
          sys.path.insert(0, os.getcwd())
          import projections as p
          N = int(sys.argv[1])
          WATCH = ("Molmen", "Jamzee", "Fryar")
          WHO = ("Korch", "Wu", "Fryar", "Molmen", "Jamzee")
          src = textwrap.dedent(inspect.getsource(p.simulate))
          src = src.replace("    for _ in range(n):\n        totals = dict(base)\n",
                            "    for _ in range(n):\n        totals = dict(base)\n        _snap = {c: dict(cat_add[c]) for c in cat_add}\n")
          src = src.replace("        ranked = sorted(players_list, key=lambda x: -totals[x])\n",
                            "        ranked = sorted(players_list, key=lambda x: -totals[x])\n"
                            "        _d = {nm: {c: round(cat_add[c][nm] - _snap[c][nm], 1) for c in cat_add if abs(cat_add[c][nm] - _snap[c][nm]) > 0.05} for nm in _WHO}\n"
                            "        _ALL.append((ranked[0], _d, round(totals[ranked[0]] - totals[ranked[1]], 1)))\n")
          ns = vars(p); ns["_ALL"] = []; ns["_WHO"] = WHO
          exec(compile(src, "simulate_patched", "exec"), ns)
          scores = json.load(open(p.SCORES_PATH))["players"]
          used = []; odds = p.build_odds(used); odds["mls_playoff_model"] = p._build_mls_playoff_model(odds, used)
          odds["nascar_chase_model"] = p._build_nascar_chase_model(odds, used)
          res, _ = ns["simulate"](scores, odds, n=N)
          A = ns["_ALL"]
          out = {"n": N, "win_pct": {k: v["win_pct"] for k, v in res.items()}, "totals": {s["name"]: s["total"] for s in scores},
                 "mls_champ": odds.get("mls_champ"), "by_winner": {}}
          for W in WATCH:
              ws = [(d, m) for w, d, m in A if w == W]
              dist = collections.defaultdict(collections.Counter)
              for d, m in ws:
                  for nm in WHO:
                      for c in ("mlb", "mls", "nascar", "actor", "actress", "stock"):
                          dist[f"{nm}:{c}"][d[nm].get(c, 0.0)] += 1
              out["by_winner"][W] = {"n": len(ws), "margin_median": sorted(m for _, m in ws)[len(ws) // 2] if ws else None,
                                     "examples": [dict(d, margin=m) for d, m in ws[:5]],
                                     "dist": {k: {str(v): round(c / max(1, len(ws)), 3) for v, c in sorted(cnt.items())} for k, cnt in dist.items()}}
          # Fryar's win rate by Blaney's finish (his NASCAR bonus) and by MLS bonus
          for key in ("nascar", "mls", "stock"):
              tab = collections.defaultdict(lambda: [0, 0])
              for w, d, m in A:
                  k = d["Fryar"].get(key, 0.0); tab[k][0] += 1; tab[k][1] += (w == "Fryar")
              out[f"fryar_winrate_by_{key}"] = {str(k): [v[0], round(v[1] / v[0], 4)] for k, v in sorted(tab.items())}
          print("SCEN5>>" + json.dumps(out) + "<<SCEN5")
          PYEOF

      - name: Scenarios on main
        run: python ../scenarios.py 400000 2>&1 | grep -E "SCEN5>>|Traceback|Error|NASCAR Chase" | sed 's/^/MAIN /'
