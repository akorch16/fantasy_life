name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "IMF WEO"
        run: |
          python - <<'PY'
          import requests, json, cloudscraper
          H = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125 Safari/537.36'}
          # 1. DBnomics dataset list
          r = requests.get('https://api.db.nomics.world/v22/datasets/IMF?limit=100&offset=0', headers=H, timeout=60)
          print('DBN-LIST', r.status_code, r.text[:200].replace('\n', ' '))
          try:
              docs = r.json()['datasets']['docs']
              print('DBN-WEO', [d['code'] for d in docs if 'WEO' in d['code']])
          except Exception as e:
              print('ERR', repr(e))
          # 2. latest vintage values
          u = 'https://api.db.nomics.world/v22/series/IMF/WEO:2025-04?dimensions=%7B%22weo-subject%22%3A%5B%22NGDP_RPCH%22%5D%7D&limit=500&observations=1&format=json'
          rr = requests.get(u, headers=H, timeout=90)
          print('DBN-SERIES', rr.status_code, len(rr.text))
          if rr.status_code == 200:
              j = rr.json(); out = {}
              for s in j['series']['docs']:
                  m = dict(zip(s.get('period') or [], s.get('value') or []))
                  out[s.get('series_code')] = [s.get('series_name'), m.get('2025'), m.get('2026'), m.get('2027')]
              print('IMF2504>>' + json.dumps(out) + '<<IMF2504')
          # 3. direct IMF files through cloudscraper
          sc = cloudscraper.create_scraper()
          for url in ['https://www.imf.org/external/datamapper/api/v1/NGDP_RPCH',
                      'https://www.imf.org/-/media/Files/Publications/WEO/WEO-Database/2026/April/WEOApr2026all.xls',
                      'https://www.imf.org/-/media/Files/Publications/WEO/WEO-Database/2026/WEOApr2026all.xls',
                      'https://www.imf.org/en/Publications/WEO/weo-database/2026/April/download-entire-database']:
              try:
                  x = sc.get(url, timeout=60)
                  print('IMF-DIRECT', x.status_code, len(x.content), url, x.text[:150].replace('\n', ' '))
              except Exception as e:
                  print('IMF-DIRECT ERR', url, repr(e)[:150])
          PY
