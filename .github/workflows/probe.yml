name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: "api.imf.org WEO (SDMX-JSON)"
        run: |
          python - <<'PY'
          import requests, json
          H = {'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json'}
          B = 'https://api.imf.org/external/sdmx/3.0'
          def val(defn, a):
              vv = defn.get('values') or []
              if isinstance(a, int) and a < len(vv):
                  x = vv[a]
                  return x.get('value') or x.get('id') or x.get('name') or x
              return a
          r = requests.get(f'{B}/data/dataflow/IMF.RES/WEO/+/*.NGDP_RPCH.A', params={'attributes': 'all'}, headers=H, timeout=120)
          print('DATA', r.status_code, len(r.content))
          d = r.json().get('data')
          st = d['structures'][0]
          sdims = st['dimensions']['series']; odims = st['dimensions']['observation']
          times = [v.get('value') or v.get('id') for v in odims[0]['values']]
          sattr = st.get('attributes', {}).get('series', []); dsattr = st.get('attributes', {}).get('dataSet', [])
          ds = d['dataSets'][0]
          dsv = ds.get('attributes') or []
          for i, a in enumerate(dsv):
              if i < len(dsattr) and dsattr[i]['id'] in ('PUBLICATION_DATE', 'UPDATE_DATE', 'SHORT_SOURCE_CITATION', 'FULL_SOURCE_CITATION', 'DOI'):
                  print('DSATTR', dsattr[i]['id'], json.dumps(val(dsattr[i], a))[:300])
          print('time range', times[0], times[-1])
          ci = [x['id'] for x in sdims].index('COUNTRY')
          out = {}; upd = {}
          for key, s in ds['series'].items():
              idx = [int(k) for k in key.split(':')]
              cv = sdims[ci]['values'][idx[ci]]
              vals = {}
              for t, o in (s.get('observations') or {}).items():
                  yr = str(times[int(t)])[:4]
                  if yr in ('2024', '2025', '2026', '2027', '2028'):
                      vals[yr] = o[0] if isinstance(o, list) else o
              att = {}
              for i, a in enumerate(s.get('attributes') or []):
                  if a is not None and i < len(sattr):
                      att[sattr[i]['id']] = val(sattr[i], a)
              u = att.get('COUNTRY_UPDATE_DATE')
              upd[str(u)[:7]] = upd.get(str(u)[:7], 0) + 1
              out[cv['id']] = {'name': cv.get('name'), 'v': vals, 'upd': u}
          print('countries', len(out), 'COUNTRY_UPDATE_DATE months', sorted(upd.items()))
          for c in ['GUY', 'SSD', 'GIN', 'ARG', 'ESP', 'USA', 'BRA', 'NOR', 'CAN', 'CHE', 'NLD', 'FRA', 'DEU', 'SDN', 'QAT', 'ETH']:
              print(' ', c, json.dumps(out.get(c)))
          print('WEOJSON>>' + json.dumps(out) + '<<WEOJSON')
          PY
