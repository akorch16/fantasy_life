name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Kalshi targeted markets"
        run: |
          python - <<'PY'
          import json
          import projections as p
          SER = ['KXNFLPLAYOFF', 'KXNFL1SEED', 'KXNFLAFCEAST', 'KXNFLAFCNORTH', 'KXNFLAFCSOUTH', 'KXNFLAFCWEST', 'KXNFLNFCEAST', 'KXNFLNFCNORTH',
                 'KXNFLNFCSOUTH', 'KXNFLNFCWEST', 'KXNFLWINS', 'KXNFLAFCCHAMP', 'KXNFLNFCCHAMP', 'KXSB',
                 'KXNBAPLAYOFF', 'KXNBAWINS', 'KXNBAEAST1SEED', 'KXNBAWEST1SEED', 'KXNBAECFQUAL', 'KXNBAWCFQUAL', 'KXTEAMSINNBAF', 'KXNBAEAST', 'KXNBAWEST', 'KXNBA',
                 'KXNBAPLAYIN', 'KXNBAATLANTIC', 'KXNBACENTRAL', 'KXNBASOUTHEAST', 'KXNBANORTHWEST', 'KXNBAPACIFIC', 'KXNBASOUTHWEST',
                 'KXNHLPLAYOFF', 'KXNHLWINS', 'KXNHLATLANTIC', 'KXNHLMETROPOLITAN', 'KXNHLCENTRAL', 'KXNHLPACIFIC', 'KXNHLEAST', 'KXNHLWEST', 'KXNHL']
          for t in SER:
              try:
                  ms = p._fetch_markets_for_series(t)
              except Exception as e:
                  print('MKT ERR', t, repr(e)[:80]); continue
              rows = []
              for m in ms[:70]:
                  rows.append([m.get('ticker'), m.get('yes_sub_title') or m.get('title'), m.get('yes_bid_dollars'), m.get('yes_ask_dollars'),
                               m.get('last_price_dollars'), m.get('status'), (m.get('close_time') or '')[:10]])
              print('MKT>>' + json.dumps([t, len(ms), rows], ensure_ascii=False) + '<<MKT')
          PY

      - name: "ESPN NBA/NHL schedules per day"
        run: |
          python - <<'PY'
          import requests, json, datetime, time
          H = {'User-Agent': 'Mozilla/5.0'}
          def day(path, d):
              r = requests.get(f'https://site.api.espn.com/apis/site/v2/sports/{path}/scoreboard', params={'dates': d.strftime('%Y%m%d'), 'limit': 100}, headers=H, timeout=30)
              out = []
              for ev in r.json().get('events', []):
                  c = ev['competitions'][0]
                  teams = {x['homeAway']: x for x in c['competitors']}
                  out.append([ev['date'][:10], teams['away']['team']['displayName'], teams['home']['team']['displayName'],
                              teams['away'].get('score'), teams['home'].get('score'), c['status']['type']['name'], ev.get('season', {}).get('type')])
              return out
          for lg, path, a, b in [('NBA', 'basketball/nba', datetime.date(2026, 10, 19), datetime.date(2027, 4, 15)),
                                 ('NHL', 'hockey/nhl', datetime.date(2026, 9, 28), datetime.date(2027, 4, 17))]:
              rows = []
              d = a
              while d <= b:
                  try:
                      rows += day(path, d)
                  except Exception as e:
                      print(lg, 'ERR', d, repr(e)[:60])
                  d += datetime.timedelta(days=1)
              print(lg, 'games', len(rows), 'types', sorted({r[6] for r in rows}, key=str))
              print(lg + 'JSON>>' + json.dumps(rows, ensure_ascii=False) + '<<' + lg + 'JSON')
          PY
