name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r main/requirements.txt

      - name: Write scenario script
        run: |
          cat > scenarios.py <<'PYEOF'
          import json, requests
          H = {"User-Agent": "Mozilla/5.0"}
          out = {}
          for k, u in [("points", "https://cf.nascar.com/cacher/2026/1/racinginsights-points-feed.json"),
                       ("races", "https://cf.nascar.com/cacher/2026/race_list_basic.json"),
                       ("espn", "https://site.api.espn.com/apis/v2/sports/racing/nascar-premier/standings")]:
              try:
                  r = requests.get(u, headers=H, timeout=30)
                  out[k] = {"status": r.status_code, "len": len(r.content)}
                  j = r.json()
                  if k == "points":
                      out[k]["sample"] = j[:3] if isinstance(j, list) else str(j)[:500]
                      out[k]["rows"] = [{kk: d.get(kk) for kk in ("driver_name", "points_position", "points", "delta_leader", "playoff_eliminated", "is_in_chase", "wins", "starts", "top_5", "playoff_points", "points_earned_this_race") if kk in d} for d in (j if isinstance(j, list) else [])][:40]
                      out[k]["keys"] = list(j[0].keys()) if isinstance(j, list) and j else None
                  elif k == "races":
                      s1 = j.get("series_1") if isinstance(j, dict) else None
                      out[k]["cup"] = [{kk: r_.get(kk) for kk in ("race_name", "date_scheduled", "race_date", "track_name", "winner_driver_id", "playoff_round")} for r_ in (s1 or [])][-12:]
                  else:
                      out[k]["text"] = json.dumps(j)[:3000]
              except Exception as e:
                  out.setdefault(k, {})["err"] = repr(e)[:200]
          try:
              import projections as p
              ms = p._fetch_markets_for_series("KXNASCARCUPSERIES")
              out["kalshi"] = [[m.get("ticker"), m.get("yes_sub_title") or m.get("title"), m.get("yes_bid_dollars"), m.get("yes_ask_dollars"), m.get("last_price_dollars"), m.get("status")] for m in ms[:60]]
          except Exception as e:
              out["kalshi_err"] = repr(e)[:200]
          print("NPROBE>>" + json.dumps(out) + "<<NPROBE")
          PYEOF

      - name: Scenarios on main
        working-directory: main
        run: python ../scenarios.py 2>&1 | grep -E "NPROBE>>|Traceback|Error" | sed 's/^/MAIN /'
