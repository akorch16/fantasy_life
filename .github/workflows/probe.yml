name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dump live NBA standings from Supabase
        run: |
          python - <<'PY'
          import db
          from scoring import team_matches
          for cat in ['NBA', 'NHL', 'MLB', 'MLS', 'NCAAB', 'NFL', 'NCAAF']:
              d = db.get_standing(cat)
              rows = (d or {}).get('standings') or (d or {}).get('scores') or []
              print('=====', cat, 'rows:', len(rows), 'frozen:', db.is_frozen(cat), 'updated_at:', db.get_standing_updated_at(cat) if hasattr(db, 'get_standing_updated_at') else None)
              if cat == 'NBA':
                  for r in rows:
                      print('   ', r)
              else:
                  names = [r.get('team') or r.get('name') for r in rows]
                  print('   teams:', names)
          from draft_picks_2026 import DRAFT_PICKS_2026
          d = db.get_standing('NBA') or {}
          rows = d.get('standings') or []
          for player, pick in DRAFT_PICKS_2026['NBA'].items():
              hit = [r.get('team') for r in rows if team_matches(pick, r.get('team'))]
              print('NBA pick', player, pick, '->', hit)
          PY
