name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Tavily usage
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request('https://api.tavily.com/usage',
                                       headers={'Authorization': 'Bearer ' + os.environ['TAVILY_API_KEY']})
          try:
              print('USAGE>>' + urllib.request.urlopen(req, timeout=30).read().decode() + '<<USAGE')
          except Exception as e:
              print('USAGE_ERR', e, getattr(e, 'read', lambda: b'')()[:300])
          PY
