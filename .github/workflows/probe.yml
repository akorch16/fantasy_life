name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r main/requirements.txt

      - name: Write scenario script
        run: |
          cat > scenarios.py <<'PYEOF'
          """Condition on Bell (Wu) or Blaney (Fryar) winning the NASCAR title; who wins and what decides it."""
          import inspect, json, sys, textwrap, collections, os
          sys.path.insert(0, os.getcwd())
          import projections as p
          N = int(sys.argv[1])
          src = textwrap.dedent(inspect.getsource(p.simulate))
          src = src.replace("    for _ in range(n):\n        totals = dict(base)\n",
                            "    for _ in range(n):\n        totals = dict(base)\n        _snap = {c: dict(cat_add[c]) for c in cat_add}\n")
          src = src.replace("        ranked = sorted(players_list, key=lambda x: -totals[x])\n",
                            "        ranked = sorted(players_list, key=lambda x: -totals[x])\n"
                            "        _d = {nm: {c: round(cat_add[c][nm] - _snap[c][nm], 1) for c in cat_add if abs(cat_add[c][nm] - _snap[c][nm]) > 0.05} for nm in ('Korch', 'Wu', 'Fryar')}\n"
                            "        _ALL.append((ranked[0], _d, {k: round(v, 1) for k, v in totals.items() if k in ('Korch', 'Wu', 'Fryar')}))\n")
          ns = vars(p); ns["_ALL"] = []
          exec(compile(src, "simulate_patched", "exec"), ns)
          scores = json.load(open(p.SCORES_PATH))["players"]
          used = []; odds = p.build_odds(used); odds["mls_playoff_model"] = p._build_mls_playoff_model(odds, used)
          ns["simulate"](scores, odds, n=N)
          A = ns["_ALL"]
          CATS = ("mls", "nascar", "actor", "stock")
          out = {"n": N}
          for who in ("Wu", "Fryar"):
              sub = [x for x in A if x[1][who].get("nascar", 0) >= 13]
              rec = {"n_cond": len(sub), "p_cond": round(len(sub) / N, 4), "winners": collections.Counter(w for w, _, _ in sub)}
              for outcome in (who, "Korch"):
                  ws = [x for x in sub if x[0] == outcome]
                  dist = collections.defaultdict(collections.Counter)
                  for _, d, t in ws:
                      for nm in ("Korch", "Wu", "Fryar"):
                          for c in CATS:
                              dist[f"{nm}:{c}"][d[nm].get(c, 0.0)] += 1
                  rec[f"when_{outcome}_wins"] = {"n": len(ws), "dist": {k: {str(v): round(n / max(1, len(ws)), 3) for v, n in sorted(c.items())} for k, c in dist.items()}}
              # win rate by Korch stock delta and by challenger stock delta
              for nm in ("Korch", who):
                  tab = collections.defaultdict(lambda: [0, 0])
                  for w, d, t in sub:
                      k = d[nm].get("stock", 0.0); tab[k][0] += 1; tab[k][1] += (w == who)
                  rec[f"winrate_by_{nm}_stock"] = {str(k): [v[0], round(v[1] / v[0], 3)] for k, v in sorted(tab.items())}
              out[who] = rec
          print("SCEN4>>" + json.dumps(out) + "<<SCEN4")
          PYEOF

      - name: Scenarios on main
        working-directory: main
        run: python ../scenarios.py 400000 2>&1 | grep -E "SCEN4>>|Traceback|Error" | sed 's/^/MAIN /'
