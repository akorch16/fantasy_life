name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r main/requirements.txt

      - name: Write scenario script
        run: |
          cat > scenarios.py <<'PYEOF'
          """Record every sim not won by Korch; summarise, per winner, how often each category outcome occurs."""
          import inspect, json, sys, textwrap, collections, os
          sys.path.insert(0, os.getcwd())
          import projections as p
          N = int(sys.argv[1])
          src = textwrap.dedent(inspect.getsource(p.simulate))
          src = src.replace("    for _ in range(n):\n        totals = dict(base)\n",
                            "    for _ in range(n):\n        totals = dict(base)\n        _snap = {c: dict(cat_add[c]) for c in cat_add}\n")
          src = src.replace("        ranked = sorted(players_list, key=lambda x: -totals[x])\n",
                            "        ranked = sorted(players_list, key=lambda x: -totals[x])\n"
                            "        _d = {nm: {c: round(cat_add[c][nm] - _snap[c][nm], 1) for c in cat_add if abs(cat_add[c][nm] - _snap[c][nm]) > 0.05} for nm in ('Korch', 'Wu', 'Fryar')}\n"
                            "        _ALL.append((ranked[0], _d, round(totals[ranked[0]] - totals['Korch'], 1) if ranked[0] != 'Korch' else round(totals['Korch'] - totals[ranked[1]], 1)))\n")
          assert "_ALL.append" in src
          ns = vars(p); ns["_ALL"] = []
          exec(compile(src, "simulate_patched", "exec"), ns)
          scores = json.load(open(p.SCORES_PATH))["players"]
          used = []; odds = p.build_odds(used); odds["mls_playoff_model"] = p._build_mls_playoff_model(odds, used)
          res, _ = ns["simulate"](scores, odds, n=N)
          A = [x for x in ns["_ALL"] if x[1]["Wu"].get("nascar", 0) < 13 and x[1]["Fryar"].get("nascar", 0) < 13]
          NC = len(A)
          out = {"n": N, "n_cond": NC, "cond_winners": collections.Counter(w for w, d, m in A), "win_pct": {k: v["win_pct"] for k, v in res.items()}, "odds": {k: odds.get(k) for k in ("nascar_champ", "mlb_champ", "mls_champ")}, "by_winner": {}}
          base = collections.defaultdict(collections.Counter)            # unconditional distributions
          for w, d, m in A:
              for who in ("Korch", "Wu", "Fryar"):
                  for c in ("mlb", "mls", "nascar", "actor", "actress", "stock"):
                      base[f"{who}:{c}"][d[who].get(c, 0.0)] += 1
          out["all"] = {k: {str(v): round(n / NC, 4) for v, n in sorted(cnt.items())} for k, cnt in base.items()}
          for W in ("Wu", "Fryar"):
              ws = [(d, m) for w, d, m in A if w == W]
              if not ws: continue
              dist = collections.defaultdict(collections.Counter)
              for d, m in ws:
                  for who in ("Korch", "Wu", "Fryar"):
                      for c in ("mlb", "mls", "nascar", "actor", "actress", "stock"):
                          dist[f"{who}:{c}"][d[who].get(c, 0.0)] += 1
              out["by_winner"][W] = {"n": len(ws), "margin_median": sorted(m for _, m in ws)[len(ws) // 2], "examples": [dict(d, margin=m) for d, m in ws[:6]],
                                     "dist": {k: {str(v): round(n / len(ws), 3) for v, n in sorted(cnt.items())} for k, cnt in dist.items()}}
          print("SCEN3>>" + json.dumps(out) + "<<SCEN3")
          PYEOF

      - name: Scenarios on main
        working-directory: main
        run: python ../scenarios.py 400000 2>&1 | grep -E "SCEN3>>|Traceback|Error" | sed 's/^/MAIN /'
