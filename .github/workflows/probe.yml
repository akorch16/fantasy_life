name: Probe Scraper Sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to probe'
        type: choice
        default: scrapers
        options:
          - scrapers
          - kalshi

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe billboard.com weekly Hot 100
        run: |
          python - <<'PY'
          import requests, cloudscraper
          from bs4 import BeautifulSoup
          for d in ['2026-01-03', '2026-01-10', '2026-10-10']:
              url = f'https://www.billboard.com/charts/hot-100/{d}/'
              for name, getter in [('requests', lambda u: requests.get(u, timeout=25, headers={'User-Agent': 'Mozilla/5.0'})),
                                   ('cloudscraper', lambda u: cloudscraper.create_scraper().get(u, timeout=25))]:
                  try:
                      r = getter(url)
                      soup = BeautifulSoup(r.text, 'html.parser')
                      items = soup.select('ul.o-chart-results-list-row')
                      print(d, name, r.status_code, len(r.text), 'rows:', len(items))
                      for it in items[:10]:
                          title = it.select_one('h3#title-of-a-story')
                          artist = title.find_next('span') if title else None
                          print('    ', title.get_text(strip=True) if title else None, '|', artist.get_text(strip=True) if artist else None)
                  except Exception as e:
                      print(d, name, 'ERR', e)
          PY
