name: Sportsbook DB Diagnostic

# Manual-only: dump sb_players and sb_bets from Supabase to verify state,
# run --repair-korch to insert Korch's missing bet records, run
# --migrate-ledger to dry-run the sb_ledger backfill (read-only), or run
# --migrate-ledger --execute to perform the real, one-time backfill insert
# (still refuses to write if any player's fold doesn't match live balance —
# see db.py migrate_ledger()).

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: '--dump-sb'
        type: choice
        options:
          - '--dump-sb'
          - '--repair-korch'
          - '--migrate-ledger'
          - '--migrate-ledger --execute'

jobs:
  db-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run db tool
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python db.py ${{ github.event.inputs.command }}
