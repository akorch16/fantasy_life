name: Supabase DB Diagnostic

# Manual-only: dump sb_players and sb_bets from Supabase to verify state,
# run --repair-korch to insert Korch's missing bet records, run
# --migrate-ledger to dry-run the sb_ledger backfill (read-only), run
# --migrate-ledger --execute to perform the real, one-time backfill insert
# (still refuses to write if any player's fold doesn't match live balance —
# see db.py migrate_ledger()), run --test-place-bet-phase3 to verify the
# new place_bet RPC against a synthetic test player (zero effect on any
# real league member), run --verify-anon-lockdown to confirm the public
# anon key can still read but not write sb_players/sb_bets, or run
# --repair-nhl-freeze to restore NHL's final 2025-26 standings (wiped by
# the 2026-27 season starting) and freeze the category so it can't happen
# again — same fix NFL/NCAAF already have, or --repair-nascar-freeze to
# restore NASCAR's real final 2026 regular-season standing (the live scrape
# started reporting post-Chase-reset points once the playoffs began) and
# freeze the category the same way, or --repair-ncaab-freeze to restore the
# real final 2025-26 AP poll (the live scrape was ranking teams by a
# meaningless 0-0 preseason win percentage for the not-yet-started
# 2026-27 season) and freeze NCAAB the same way.

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: '--dump-sb'
        type: choice
        options:
          - '--dump-sb'
          - '--repair-korch'
          - '--migrate-ledger'
          - '--migrate-ledger --execute'
          - '--test-place-bet-phase3'
          - '--verify-anon-lockdown'
          - '--repair-nhl-freeze'
          - '--repair-nascar-freeze'
          - '--repair-ncaab-freeze'

jobs:
  db-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run db tool
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python db.py ${{ github.event.inputs.command }}
