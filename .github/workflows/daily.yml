name: Daily Score Update

on:
  # Primary trigger: a Claude scheduled task dispatches this workflow at 6:48 AM Eastern (DST-aware) so the site
  # is updated by ~7:00. GitHub's own cron is only a BACKUP: on this repo it has been starting 4-9 hours late
  # (Oct 2026: never before 11:51 UTC for an 08:00 UTC slot), so it can't be the clock. 12:17 UTC = 7:17 EST / 8:17 EDT.
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:        # "Run workflow" button in GitHub Actions UI (and the 6:48 AM ET scheduled task)

jobs:
  # A scheduled (backup) run skips itself if today's (Eastern date) update already succeeded. Manual / dispatched runs always run.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(TZ=America/New_York date +%F)
          since=$(date -u -d "@$(TZ=America/New_York date -d "$today 00:00" +%s)" +%Y-%m-%dT%H:%M:%SZ)
          n=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily.yml/runs?status=success&created=%3E%3D$since&per_page=5" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('total_count', 0))" || echo 0)
          echo "successful runs since $since (ET midnight): $n"
          if [ "$n" -gt 0 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "Already updated today — skipping backup run."; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  update-scores:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit scores.json back to the repo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check env + imports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -V
          python -c "import scrapers; print('scrapers import OK')"
          python -c "import scoring;  print('scoring  import OK')"
          echo "SUPABASE_URL set: ${{ secrets.SUPABASE_URL != '' }}"

      - name: Scrape all data sources → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python scrapers.py

      - name: Compute scores → docs/scores.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scoring.py

      - name: Compute projections → docs/projections.json
        continue-on-error: true
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}   # MLS playoff model reads the stored 30-team table
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python projections.py

      - name: Compute 2027 standings → docs/scores_2027.json
        continue-on-error: true   # a failed fetch re-scores from cached values (flagged stale); never fail the daily run
        run: python scoring_2027.py

      - name: Generate FL News headline
        continue-on-error: true   # API credit exhaustion must not fail the workflow
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python headline.py

      - name: Sanity-check outputs before commit
        run: |
          python -m py_compile *.py
          python - <<'EOF'
          import json
          scores = json.load(open('docs/scores.json'))
          assert len(scores['players']) == 13, f"expected 13 players, got {len(scores['players'])}"
          json.load(open('docs/projections.json'))
          print('sanity OK: scores.json (13 players) + projections.json parse')
          EOF

      - name: Commit & push scores + projections + headline
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/scores.json docs/projections.json docs/projection_history.json data/sb_settled.json docs/scores_2027.json data/standings_2027.json data/nascar_chase.json
          git diff --staged --quiet || git commit -m "chore: update scores + projections $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
